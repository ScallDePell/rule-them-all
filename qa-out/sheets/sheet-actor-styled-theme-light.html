  text-align: left;
}

.rta-explorer .rta-explorer__item--primary {
  background: color-mix(in srgb, var(--rta-nav-accent, var(--rta-color-neutral)) 13%, transparent);
  border: 1px solid var(--rta-panel-border);
  font-weight: 650;
  margin-bottom: var(--rta-space-4);
}

.rta-explorer__primary-icon {
  color: var(--rta-nav-accent, var(--rta-color-neutral));
  flex: 0 0 auto;
  font-size: var(--rta-type-base);
}

/* flyout card border and full-strength family accents */
.rta-configurator .rta-explorer__flyout-list .rta-explorer__item {
  color: var(--rta-color-text, inherit);
  opacity: 1;
  text-align: left;
}

/* 1.5x wide flyout; use the entire sidebar height before scrolling. */


/* allow the flyout to extend above the workspace without being
   clipped by the workspace grid; keep the native Foundry title bar above it. */
.rta-configurator .rta-configurator__workspace:has(> .rta-explorer) {
  position: relative;
  overflow: visible;
  z-index: 5;
}

.rta-configurator .rta-explorer {
  position: relative;
  z-index: 6;
}

.rta-configurator .rta-explorer__flyout {
  background: var(--rta-color-surface);
  width: 270px;
  max-height: none;
  border: 1px solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-control);
  z-index: 30;
}

/* Canonical full-height Ruleset rail: tile style for cards, General and navigation.
   The existing --rta-card-accent is sourced from the Ruleset / section / collection.
   No inset shadow, miniature bar or competing border-left width. */
.rta-configurator :is(
  .rta-ruleset-tile,
  .rta-config-card,
  .rta-general__card,
  .rta-general__storage,
  .rta-dependencies__row,
  .rta-explorer__group.is-active,
  .rta-explorer__flyout-list .rta-explorer__item
) {
  border-left: var(--rta-rail-width) solid var(--rta-card-accent, var(--rta-color-neutral));
  border-top-left-radius: var(--rta-radius-compact);
  border-bottom-left-radius: var(--rta-radius-compact);
}

/* Rule Them'All — rulesets.css : Page d'accueil : tuiles et liste des Rulesets.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

.rta-configurator__root-header,
.rta-configurator__workspace-header,
.rta-configurator__section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-block);
}

.rta-configurator__root-header,
.rta-configurator__workspace-header {
  flex-shrink: 0;
  padding-block: var(--rta-space-3) var(--rta-space-5);
}

.rta-configurator__root-header h2,
.rta-configurator__section-heading h2 {
  margin: 0;
}

.rta-configurator__root-header p,
.rta-configurator__section-heading p {
  margin: var(--rta-space-2) 0 0;
}

.rta-config-table--rulesets {
  min-width: 520px;
}

.rta-ruleset-list-scroll {
  padding: var(--rta-space-4) 0 var(--rta-space-8);
}

.rta-ruleset-tile__title:hover {
  text-decoration: underline;
  box-shadow: none;
}

.rta-ruleset-badge.rta-ruleset-badge--version,
.rta-ruleset-badge.rta-ruleset-badge--active {
  background: var(--rta-color-success-fill);
  color: var(--rta-color-success-text);
}

/* compact Foundry-like cards, fixed footer and single-line controls. */
.rta-ruleset-tiles {
  display: grid;
  align-content: start;
  grid-template-columns: repeat(auto-fill, 282px);
  gap: var(--rta-gap-block);
  justify-content: start;
}

.rta-ruleset-tile {
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
  padding: var(--rta-space-5) var(--rta-space-6) var(--rta-space-4);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-compact);
  background: rgba(15, 11, 23, .72);
  display: grid;
  overflow: hidden;
  box-sizing: border-box;
  width: 282px;
  height: 94px;
  min-height: 94px;
  max-height: 94px;
  grid-template-rows: 2.7rem minmax(0, 1fr);
}

.rta-ruleset-tile__title {
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  box-shadow: none;
  color: var(--rta-color-text-highlight);
  font-size: var(--rta-type-medium);
  font-weight: 700;
  width: 100%;
  height: 2.7rem;
  max-height: 2.7rem;
  line-height: 1.35rem;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  overflow-wrap: anywhere;
  text-align: left;
  align-self: start;
}

.rta-ruleset-tile__actions .rta-config-action {
  padding: var(--rta-space-1);
  font-size: var(--rta-type-sm);
  flex: 0 0 23px;
  width: 21px;
  min-width: 21px;
  flex-basis: 21px;
  height: 23px;
}

.rta-ruleset-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  min-height: 20px;
  padding: var(--rta-space-1) var(--rta-space-2);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: var(--rta-radius-rail);
  font-weight: 700;
  line-height: 1.2;
  background: var(--rta-color-badge-fill);
  color: var(--rta-color-badge-text);
  flex-shrink: 0;
  white-space: nowrap;
  font-size: var(--rta-type-xs);
  padding-inline: var(--rta-space-1);
}

/* independent badge and action columns, anchored to card edges. */
.rta-ruleset-tile__bottom {
  gap: var(--rta-gap-tight);
  margin-top: 0;
  justify-content: space-between;
  flex-wrap: nowrap;
  overflow: hidden;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 1fr) max-content;
  align-items: end;
  width: 100%;
  min-width: 0;
  column-gap: var(--rta-gap-tight);
}

.rta-ruleset-tile__badges {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  justify-content: flex-start;
  flex: 0 1 auto;
  gap: var(--rta-gap-tight);
  min-width: 0;
  justify-self: start;
  overflow: hidden;
}

.rta-ruleset-tile__actions {
  display: flex;
  flex-wrap: nowrap;
  gap: var(--rta-gap-tight);
  justify-content: flex-end;
  flex: 0 0 auto;
  justify-self: end;
  margin-left: 0;
  width: max-content;
}

/* pin both footer groups to the card itself, not the footer layout. */
.rta-configurator .rta-ruleset-tile {
  position: relative;
}

.rta-configurator .rta-ruleset-tile__bottom {
  position: static;
  display: contents;
}

.rta-configurator .rta-ruleset-tile__badges {
  position: absolute;
  left: .7rem;
  bottom: .5rem;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  width: auto;
  max-width: calc(100% - 155px);
  margin: 0;
  overflow: hidden;
}

.rta-configurator .rta-ruleset-tile__actions {
  position: absolute;
  right: .7rem;
  bottom: .5rem;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: flex-end;
  width: auto;
  margin: 0;
  gap: var(--rta-gap-tight);
}

.rta-configurator .rta-ruleset-tile__actions .rta-config-action {
  flex: 0 0 21px;
  min-width: 21px;
  width: 21px;
  height: 23px;
  margin: 0;
}

.rta-configurator .rta-config-card-grid.rta-display-lines,.rta-configurator .rta-ruleset-tiles.rta-display-lines {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-block);
  width: 100%;
  align-items: stretch;
}

.rta-configurator .rta-ruleset-tiles.rta-display-lines .rta-ruleset-tile {
  width: 100%;
  max-width: none;
  min-height: 36px;
  height: auto;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(110px,1fr) max-content;
  grid-template-rows: 1fr;
  align-items: center;
  gap: var(--rta-gap-block);
  padding: var(--rta-space-2) var(--rta-space-5);
}

.rta-configurator .rta-display-lines .rta-ruleset-tile__title {
  grid-column: 1;
  grid-row: 1;
  min-width: 0;
  text-align: left;
}

.rta-configurator .rta-display-lines .rta-ruleset-tile__bottom {
  display: contents;
}

.rta-configurator .rta-display-lines .rta-ruleset-tile__badges {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

/* Canonical card geometry shared by Ruleset and collection views.
   Keep semantic focus-visible feedback for keyboard users, never transient mouse rings. */
.rta-configurator :is(.rta-ruleset-tiles, .rta-config-card-grid):not(.rta-display-lines) {
  grid-template-columns: repeat(auto-fill, var(--rta-card-width));
  gap: var(--rta-card-gap);
}

.rta-configurator :is(.rta-ruleset-tile, .rta-config-card) {
  box-sizing: border-box;
  border-radius: var(--rta-radius-compact);
  border: 1px solid var(--rta-color-border);
  background: var(--rta-color-surface);
}

.rta-configurator :is(.rta-ruleset-tiles, .rta-config-card-grid):not(.rta-display-lines) > :is(.rta-ruleset-tile, .rta-config-card) {
  width: var(--rta-card-width);
  height: var(--rta-card-height);
  min-height: var(--rta-card-height);
  max-height: var(--rta-card-height);
  padding: var(--rta-card-padding-top) var(--rta-space-6) var(--rta-card-padding-bottom) calc(var(--rta-space-6) - var(--rta-space-1));
}

.rta-configurator :is(.rta-ruleset-tile__title, .rta-config-card__title) {
  appearance: none;
  outline: none;
  box-shadow: none;
  border: 0;
  border-radius: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  min-height: 0;
  color: var(--rta-color-text-highlight);
  text-align: left;
  font-size: var(--rta-type-medium);
  font-weight: 700;
  line-height: 1.35rem;
}

.rta-configurator :is(.rta-ruleset-tile__title, .rta-config-card__title):is(:hover, :focus, :active, :focus-visible) {
  outline: none;
  box-shadow: none;
  background: transparent;
}

/* Keyboard navigation remains visibly accessible on the parent card only. */
.rta-configurator :is(.rta-ruleset-tile, .rta-config-card):has(> :is(.rta-ruleset-tile__title, .rta-config-card__title):focus-visible) {
  outline: 1px solid var(--rta-card-accent, var(--rta-color-neutral));
  outline-offset: 1px;
}

.rta-configurator :is(.rta-ruleset-tile__actions .rta-config-action, .rta-config-card__edit) {
  box-sizing: border-box;
  flex: 0 0 var(--rta-card-action-size);
  width: var(--rta-card-action-size);
  min-width: var(--rta-card-action-size);
  height: var(--rta-card-action-size);
  min-height: var(--rta-card-action-size);
  padding: var(--rta-space-1);
  margin-top: 0;
  margin-bottom: 0;
  font-size: var(--rta-type-sm);
  line-height: 1;
}

.rta-configurator :is(.rta-ruleset-tiles, .rta-config-card-grid).rta-display-lines {
  gap: var(--rta-card-gap);
}

.rta-configurator .rta-display-lines :is(.rta-ruleset-tile, .rta-config-card) {
  width: 100%;
  max-width: none;
  min-height: 36px;
  height: auto;
  padding: var(--rta-space-2) var(--rta-space-5);
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(120px,1fr) 32px;
  grid-template-rows: 1fr;
  align-items: center;
  column-gap: var(--rta-gap-block);
}

.rta-configurator .rta-display-lines :is(.rta-ruleset-tile__title, .rta-config-card__title) {
  height: auto;
  max-height: none;
  display: block;
  grid-column: 1;
  grid-row: 1;
  align-self: center;
}

.rta-configurator .rta-display-lines :is(.rta-ruleset-tile__badges, .rta-config-card__tags) {
  position: static;
  grid-column: 2;
  grid-row: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  max-width: none;
  width: auto;
  margin: 0;
}

.rta-configurator .rta-display-lines :is(.rta-ruleset-tile__actions, .rta-config-card__edit) {
  position: static;
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
  align-self: center;
  margin: 0;
}

.rta-configurator .rta-display-lines .rta-ruleset-tile__actions {
  grid-column: 3;
  grid-row: 1;
  justify-content: flex-end;
  min-width: 0;
  margin: 0;
  display: flex;
  align-items: center;
  gap: var(--rta-gap-tight);
}

/* Rule Them'All — cards.css : Cartes de collection, modes tuiles/lignes, filtres par tags.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* collection cards. */
.rta-config-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 5.25rem);
  grid-auto-rows: 5.25rem;
  justify-content: start;
  align-content: start;
  gap: var(--rta-gap-row);
}

.rta-config-card__title {
  display: -webkit-box;
  overflow: hidden;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  font-size: var(--rta-type-sm);
  line-height: 1.15;
}

.rta-config-card__tags {
  position: absolute;
  top: 3px;
  left: 0.2rem;
  right: 0.2rem;
  display: grid;
  grid-template-columns: repeat(2, max-content);
  justify-content: center;
  align-content: start;
  gap: var(--rta-gap-tight);
  pointer-events: none;
  z-index: 1;
}

.rta-config-card__tags > .rta-config-card__tag:last-child:nth-child(odd) {
  grid-column: 1 / -1;
  justify-self: center;
}

.rta-config-card__tag {
  --rta-tag-color: var(--rta-color-surface-raised);
  display: inline-block;
  max-width: 6ch;
  padding: 0 var(--rta-space-1);
  overflow: hidden;
  white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--rta-tag-color) 70%, transparent);
  border-radius: var(--rta-radius-compact);
  background: color-mix(in srgb, var(--rta-tag-color) 78%, transparent);
  color: var(--rta-color-text-highlight);
  font-size: var(--rta-type-micro);
  font-weight: 600;
  line-height: 1.25;
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
}

.rta-config-card__tag--capability {
  --rta-tag-color: var(--rta-color-accent-warm);
}

.rta-config-card--disabled {
  opacity: 0.6;
}

.rta-config-card.rta-config-card--dragging {
  opacity: 0.35;
}

.rta-config-card.rta-config-card--drop-target {
  background: var(--rta-card-fill-hover);
  outline: 2px solid var(--rta-card-accent);
  outline-offset: 2px;
}


.rta-config-card[draggable="true"] {
  cursor: grab;
}

.rta-config-card[draggable="true"]:active {
  cursor: grabbing;
}

/* unified Content UX */
.rta-content-image-editor {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-block);
  padding: var(--rta-space-4) var(--rta-space-5);
  margin: var(--rta-space-3) 0 var(--rta-space-5);
  border: 1px solid var(--rta-color-border-secondary);
  border-radius: var(--rta-radius-compact);
}

.rta-content-image-editor img {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-compact);
  flex: 0 0 auto;
}

.rta-content-image-editor > div {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

.rta-config-card__image {
  width: 2.25rem;
  height: 2.25rem;
  object-fit: cover;
  border-radius: var(--rta-radius-compact);
  margin-bottom: var(--rta-space-2);
  pointer-events: none;
}

/* shared Foundry Ruleset tile geometry for every collection. */
.rta-configurator .rta-config-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 282px);
  grid-auto-rows: 94px;
  justify-content: start;
  align-content: start;
  gap: var(--rta-gap-block);
}

.rta-configurator .rta-config-card__title {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  width: 100%;
  height: 2.7rem;
  max-height: 2.7rem;
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: var(--rta-color-text-highlight);
  font-size: var(--rta-type-medium);
  font-weight: 700;
  line-height: 1.35rem;
  text-align: left;
  overflow: hidden;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.rta-configurator .rta-config-card__title:hover {
  text-decoration: underline;
  box-shadow: none;
}

.rta-configurator .rta-config-card__bottom {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: var(--rta-gap-tight);
  min-width: 0;
  width: 100%;
}

.rta-configurator .rta-config-card__tag {
  display: inline-block;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 100%;
  padding: var(--rta-space-1) var(--rta-space-2);
  border: 1px solid var(--rta-tag-color, var(--rta-color-border));
  border-radius: var(--rta-radius-rail);
  background: color-mix(in srgb, var(--rta-tag-color, var(--rta-color-border)) 26%, var(--rta-color-surface));
  color: var(--rta-color-text-highlight);
  font-size: var(--rta-type-xs);
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rta-configurator .rta-config-card__tags {
  flex: 1 1 auto;
  align-items: center;
  flex-wrap: nowrap;
  gap: var(--rta-gap-tight);
  min-width: 0;
  overflow: hidden;
  position: static;
  inset: auto;
  display: flex;
  justify-content: flex-start;
  align-content: center;
  grid-template-columns: none;
  pointer-events: auto;
  z-index: auto;
}

.rta-configurator .rta-config-card__tags > .rta-config-card__tag:last-child:nth-child(odd) {
  grid-column: auto;
  justify-self: auto;
}

/* match the 12px inter-tile gap above the first collection row. */
.rta-configurator .rta-configurator__section-heading:has(+ .rta-config-card-grid) {
  margin-bottom: var(--rta-space-6);
}

/* understated category accent; preserve neutral borders and tile geometry. */
.rta-configurator .rta-config-card:hover,
.rta-configurator .rta-config-card:focus-visible {
  background: color-mix(in srgb, var(--rta-card-accent, var(--rta-color-neutral)) 5%, var(--rta-color-surface));
}

/* two non-destructive collection display modes. */
.rta-configurator .rta-display-switch {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  margin-right: var(--rta-space-4);
  flex-shrink: 0;
}

.rta-configurator .rta-display-switch button {
  width: 30px;
  min-width: 30px;
  height: 29px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-compact);
  background: transparent;
}

.rta-configurator .rta-display-switch button.is-active {
  background: color-mix(in srgb, var(--rta-card-accent, var(--rta-color-neutral)) 22%, transparent);
  border-color: var(--rta-card-accent, var(--rta-color-neutral));
}

.rta-configurator .rta-config-card-grid.rta-display-lines .rta-config-card {
  width: 100%;
  max-width: none;
  min-height: 36px;
  height: auto;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(120px,1fr);
  grid-template-rows: 1fr;
  align-items: center;
  column-gap: var(--rta-gap-block);
  padding: var(--rta-space-2) var(--rta-space-5);
}

.rta-configurator .rta-display-lines .rta-config-card__title {
  grid-column: 1;
  grid-row: 1;
  min-width: 0;
  margin: 0;
  max-width: none;
  text-align: left;
}

.rta-configurator .rta-display-lines .rta-config-card__bottom {
  display: contents;
}

.rta-configurator .rta-display-lines .rta-config-card__tags {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: var(--rta-gap-tight);
  min-width: 0;
}


/* Collection cards share the neutral frame, but their left border is the type/family accent. */
.rta-configurator .rta-config-card {
  --rta-card-fill: color-mix(in srgb, var(--rta-card-accent) 18%, transparent);
  --rta-card-fill-hover: color-mix(in srgb, var(--rta-card-accent) 32%, transparent);
  position: relative;
  white-space: normal;
  transition: background-color 120ms ease, filter 120ms ease;
  box-sizing: border-box;
  width: 282px;
  height: 94px;
  min-width: 0;
  min-height: 94px;
  max-height: 94px;
  display: grid;
  grid-template-rows: 2.7rem minmax(0,1fr);
  align-items: initial;
  justify-content: initial;
  padding: var(--rta-space-5) var(--rta-space-6) var(--rta-space-4);
  margin: 0;
  border: 1px solid var(--rta-color-border);
  text-align: left;
  overflow: hidden;
  background: var(--rta-color-surface);
  padding-left: calc(var(--rta-space-6) - var(--rta-space-1));
  border-top-color: var(--rta-panel-border);
  border-right-color: var(--rta-panel-border);
  border-bottom-color: var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
}

/* Shared tag facet for every collection; counts and selection are rendered from the same tag data. */
.rta-configurator .rta-tag-facets {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--rta-gap-row);
  margin: 0 0 var(--rta-space-6);
  padding: var(--rta-space-4) var(--rta-space-5);
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
  background: rgba(128,128,128,.035);
}

.rta-configurator .rta-tag-facets__label {
  font-size: var(--rta-type-base);
  opacity: .8;
  margin-right: var(--rta-space-3);
  white-space: nowrap;
}

.rta-configurator .rta-tag-facets__chip {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  min-height: 23px;
  height: auto;
  width: auto;
  max-width: 100%;
  padding: var(--rta-space-1) var(--rta-space-2);
  border: 1px solid var(--rta-tag-color,var(--rta-panel-border));
  border-radius: var(--rta-radius-rail);
  background: color-mix(in srgb,var(--rta-tag-color, var(--rta-color-border)) 26%,var(--rta-color-surface));
  box-shadow: none;
  color: var(--rta-color-text-highlight);
  font-size: var(--rta-type-xs);
  line-height: 1.2;
  white-space: normal;
  text-align: left;
}

.rta-configurator .rta-tag-facets__chip small {
  opacity: .72;
  font-size: var(--rta-type-sm);
}

.rta-configurator .rta-tag-facets__chip:hover:not(.is-active) {
  background: color-mix(in srgb,var(--rta-tag-color, var(--rta-color-neutral)) 13%,transparent);
}

.rta-configurator .rta-tag-facets__chip.is-active,
.rta-configurator .rta-tag-facets__chip.is-active:hover {
  background: var(--rta-color-inverse-fill);
  color: var(--rta-color-inverse-text);
  /* Keep the exact same border, dimensions and tag accent as the unselected chip. */
}

.rta-configurator .rta-tag-facets__chip.is-active small {
  color: inherit;
  opacity: 1;
}

.rta-configurator .rta-tag-facets__clear {
  width: auto;
  min-height: 27px;
  height: auto;
  padding: var(--rta-space-1) var(--rta-space-4);
  font-size: var(--rta-type-sm);
}

/* Rule Them'All — general.css : Vue Général du Ruleset.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* General presentation only; other views retain their styling. */
.rta-configurator .rta-general {
  display: grid;
  gap: var(--rta-gap-block);
}

.rta-configurator .rta-general__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--rta-gap-block);
  padding: var(--rta-space-2) var(--rta-space-1) var(--rta-space-7);
  border-bottom: 1px solid var(--rta-color-border);
}

.rta-configurator .rta-general__header h2 {
  margin: var(--rta-space-2) 0;
  font-size: var(--rta-type-display);
  line-height: 1.2;
}

.rta-configurator .rta-general__header p {
  margin: 0;
  opacity: .75;
}

.rta-configurator .rta-general__eyebrow {
  font-size: var(--rta-type-sm);
  letter-spacing: .07em;
  opacity: .7;
}

.rta-configurator .rta-general__status {
  padding: var(--rta-space-2) var(--rta-space-5);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
  text-transform: capitalize;
}

.rta-configurator .rta-general__cards {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: var(--rta-gap-block);
}

.rta-configurator .rta-general__card, .rta-configurator .rta-general__storage {
  min-width: 0;
  padding: var(--rta-space-8);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-panel);
  background: rgba(128,128,128,.06);
}

.rta-configurator .rta-general__card h3 {
  margin: 0;
  font-size: var(--rta-type-medium);
}

.rta-configurator .rta-general__card h3 i, .rta-configurator .rta-general__storage summary i {
  margin-right: var(--rta-space-4);
  opacity: .8;
}

.rta-configurator .rta-general__card dl, .rta-configurator .rta-general__storage dl {
  display: grid;
  grid-template-columns: minmax(90px,1fr) minmax(0,1.7fr);
  gap: var(--rta-gap-row) var(--rta-gap-block);
  margin: 0;
}

.rta-configurator .rta-general__card dt, .rta-configurator .rta-general__storage dt {
  opacity: .7;
}

.rta-configurator .rta-general__card dd, .rta-configurator .rta-general__storage dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.rta-configurator .rta-general__storage {
  margin: 0;
}

/* Storage / Persistence is technical: folded by default inside General. */
.rta-configurator .rta-general__storage summary {
  cursor: pointer;
  font-weight: 700;
  font-size: var(--rta-type-medium);
}

.rta-configurator .rta-general__storage[open] summary {
  margin-bottom: var(--rta-gap-row);
}

@container rta-window (max-width: 816px) {
  .rta-configurator .rta-general__cards {
    grid-template-columns: 1fr;
  }
}

/* General lifecycle controls remain in the Version and status card. */
.rta-configurator .rta-general__cards > .rta-general__card:nth-child(2) {
  display: flex;
  flex-direction: column;
}

.rta-configurator .rta-general__lifecycle-actions {
  margin-top: auto;
  padding-top: var(--rta-space-8);
  justify-content: flex-end;
}

.rta-configurator .rta-general__card,
.rta-configurator .rta-general__storage {
  border-top-color: var(--rta-panel-border);
  border-right-color: var(--rta-panel-border);
  border-bottom-color: var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
}

/* Ruleset color hierarchy: reuse existing card and nav accent tokens. */
.rta-configurator .rta-general__header-actions {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  flex-wrap: wrap;
}

/* Publish readiness: what the draft still lacks, as diagnosed by the Core. */
.rta-configurator .rta-general__readiness {
  display: grid;
  gap: var(--rta-gap-row);
}

.rta-configurator .rta-general__readiness :is(p, ul) {
  margin: 0;
}

.rta-configurator .rta-general__readiness-list {
  display: grid;
  gap: var(--rta-gap-tight);
  padding-inline-start: var(--rta-gap-block);
}

/* Each missing piece opens the editor on the field that fixes it. */
.rta-configurator .rta-general__readiness-link {
  display: inline;
  width: auto;
  min-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
  text-align: left;
  cursor: pointer;
}

.rta-configurator .rta-general__readiness-link:is(:hover, :focus-visible) {
  text-decoration: underline;
  box-shadow: none;
}

.rta-configurator .rta-general__readiness-link > i {
  margin-inline-start: var(--rta-gap-tight);
  font-size: .8em;
  opacity: .6;
}

/* Recipes (§8): folded by default; each recipe is a card with its steps. */
.rta-configurator .rta-general__recipes summary {
  cursor: pointer;
  font-weight: 700;
  font-size: var(--rta-type-medium);
}

.rta-configurator .rta-general__recipes[open] > summary {
  margin-bottom: var(--rta-gap-row);
}

.rta-configurator .rta-general__recipes > .hint {
  margin: 0 0 var(--rta-gap-row);
}

.rta-configurator .rta-general__recipe-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
  gap: var(--rta-gap-block);
}

.rta-configurator .rta-general__recipe {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  min-width: 0;
  padding: var(--rta-space-4);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
}

.rta-configurator .rta-general__recipe :is(h4, p, ol) {
  margin: 0;
}

.rta-configurator .rta-general__recipe h4 {
  border: 0;
  font-family: inherit;
  font-size: var(--rta-type-medium);
  font-weight: 700;
}

.rta-configurator .rta-general__recipe ol {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  padding-inline-start: var(--rta-space-8);
}

.rta-configurator .rta-general__recipe button {
  align-self: flex-start;
  margin-top: auto;
}

/* Rule Them'All — dependencies.css : Explorateur de dépendances.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* Dependencies: read-only two-column explorer, using the existing configurator panel language. */
.rta-configurator .rta-dependencies__stats {
  display: flex;
  gap: var(--rta-gap-block);
  flex-wrap: wrap;
  margin: 0 0 var(--rta-space-6);
  color: var(--rta-color-text-secondary);
  font-size: var(--rta-type-base);
}

.rta-configurator .rta-dependencies {
  display: grid;
  grid-template-columns: minmax(210px,34%) minmax(0,1fr);
  gap: var(--rta-gap-block);
  min-height: 360px;
  align-items: stretch;
}

.rta-configurator .rta-dependencies__list,.rta-configurator .rta-dependencies__detail {
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
  background: rgba(128,128,128,.04);
  min-width: 0;
  padding: var(--rta-space-6);
}

.rta-configurator .rta-dependencies__search {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  margin-bottom: var(--rta-space-5);
}

.rta-configurator .rta-dependencies__search input {
  min-width: 0;
  flex: 1;
}

.rta-configurator .rta-dependencies__items {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  max-height: 420px;
  overflow: auto;
}

.rta-configurator .rta-dependencies__item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--rta-gap-tight);
  text-align: left;
  min-width: 0;
  width: 100%;
  height: auto;
  padding: var(--rta-space-4) var(--rta-space-5);
  border: 1px solid transparent;
  border-radius: var(--rta-panel-radius);
  background: transparent;
  box-shadow: none;
}

.rta-configurator .rta-dependencies__item:hover,.rta-configurator .rta-dependencies__item.is-active {
  border-color: var(--rta-panel-border);
  background: rgba(128,128,128,.14);
}

.rta-configurator .rta-dependencies__item-name {
  font-weight: 700;
  overflow-wrap: anywhere;
}

.rta-configurator .rta-dependencies__item small,.rta-configurator .rta-dependencies__detail header p,.rta-configurator .rta-dependencies__relation small {
  opacity: .75;
  font-size: var(--rta-type-sm);
}

.rta-configurator .rta-dependencies__detail header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--rta-gap-block);
  border-bottom: 1px solid var(--rta-panel-border);
  padding-bottom: var(--rta-space-5);
}

.rta-configurator .rta-dependencies__detail header h3 {
  margin: 0 0 var(--rta-space-2);
  font-size: var(--rta-type-heading);
}

.rta-configurator .rta-dependencies__detail header p {
  margin: 0;
  overflow-wrap: anywhere;
}

.rta-configurator .rta-dependencies__detail h4 {
  margin: var(--rta-space-8) 0 var(--rta-space-5);
}

.rta-configurator .rta-dependencies__relations {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  max-height: 380px;
  overflow: auto;
}

.rta-configurator .rta-dependencies__relation {
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
  padding: 0;
  background: rgba(128,128,128,.04);
}

.rta-configurator .rta-dependencies__relation summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  cursor: pointer;
  padding: var(--rta-space-5);
  list-style: none;
}

.rta-configurator .rta-dependencies__relation summary::-webkit-details-marker {
  display: none;
}

.rta-configurator .rta-dependencies__relation summary span {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  min-width: 0;
  overflow-wrap: anywhere;
}

.rta-configurator .rta-dependencies__relation[open] summary i {
  transform: rotate(180deg);
}

.rta-configurator .rta-dependencies__relation dl {
  display: grid;
  grid-template-columns: 80px minmax(0,1fr);
  gap: var(--rta-gap-row);
  padding: var(--rta-space-5);
  margin: 0;
  border-top: 1px solid var(--rta-panel-border);
}

.rta-configurator .rta-dependencies__relation dd {
  margin: 0;
  overflow-wrap: anywhere;
}

@container rta-window (max-width: 716px) {
  .rta-configurator .rta-dependencies {
    grid-template-columns: 1fr;
  }
  .rta-configurator .rta-dependencies__items {
    max-height: 200px;
  }
}

/* Dependency graph: shared collection actions and canonical borders. */
.rta-configurator .rta-dependencies__row.is-active {
  background: rgba(128,128,128,.18);
}

.rta-configurator .rta-dependencies__row .rta-dependencies__item {
  border: 0;
  background: transparent;
  padding: var(--rta-space-2) var(--rta-space-2);
  min-height: 34px;
}

.rta-configurator .rta-dependencies__row .rta-dependencies__item:hover {
  background: transparent;
  border: 0;
}

.rta-configurator .rta-dependencies__row .rta-config-action {
  width: 23px;
  height: 23px;
  min-width: 23px;
  padding: 0;
}

.rta-configurator .rta-dependencies__detail {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.rta-configurator .rta-dependencies__graph-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-4) 0;
  font-size: var(--rta-type-base);
}

.rta-configurator .rta-dependencies__graph-tools>div {
  display: flex;
  gap: var(--rta-gap-tight);
}

.rta-configurator .rta-dependencies__graph-tools button {
  width: 27px;
  height: 26px;
  min-width: 27px;
  padding: 0;
}

.rta-configurator .rta-dependencies__graph {
  display: block;
  width: 100%;
  height: 340px;
  flex-shrink: 0;
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
  background: rgba(0,0,0,.13);
  touch-action: none;
  cursor: grab;
  color: var(--rta-color-text-secondary);
}

.rta-configurator .rta-dependencies__graph:active {
  cursor: grabbing;
}

.rta-configurator .rta-dependencies__edge {
  fill: none;
  stroke: var(--rta-graph-edge);
  stroke-width: 2;
  stroke-linecap: round;
}

.rta-configurator .rta-dependencies__edge.is-unresolved {
  stroke: var(--rta-graph-edge-active);
  stroke-dasharray: 6 4;
}

.rta-configurator .rta-dependencies__node {
  cursor: pointer;
}

.rta-configurator .rta-dependencies__node>rect:first-child {
  fill: var(--rta-graph-node-fill);
  stroke: var(--rta-graph-node-stroke);
  stroke-width: 1.2;
}

.rta-configurator .rta-dependencies__node.is-center>rect:first-child {
  stroke: var(--rta-graph-node-stroke-selected);
  stroke-width: 2;
}

.rta-configurator .rta-dependencies__node.is-unresolved>rect:first-child {
  stroke: var(--rta-graph-node-stroke-unresolved);
  stroke-dasharray: 4 3;
}

.rta-configurator .rta-dependencies__node-bar {
  fill: var(--rta-graph-node-fill-hover);
}

.rta-configurator .rta-dependencies__node.is-center .rta-dependencies__node-bar {
  fill: var(--rta-graph-node-fill-selected);
}

.rta-configurator .rta-dependencies__node-type {
  font-size: var(--rta-type-xs);
  fill: var(--rta-graph-label-strong);
}

.rta-configurator .rta-dependencies__node-name {
  font-size: var(--rta-type-sm);
  font-weight: 700;
  fill: var(--rta-graph-label);
}

.rta-configurator .rta-dependencies__technical {
  margin-top: var(--rta-space-5);
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
  padding: var(--rta-space-4);
}

.rta-configurator .rta-dependencies__technical>summary {
  cursor: pointer;
  font-weight: 600;
}

.rta-configurator .rta-dependencies__technical .rta-dependencies__relations {
  margin-top: var(--rta-space-4);
  max-height: 190px;
}

/* Dependencies: canonical collection accent and action sizing. */
.rta-configurator .rta-dependencies__row {
  display: grid;
  grid-template-columns: minmax(0,1fr) 26px;
  align-items: stretch;
  gap: var(--rta-gap-row);
  min-height: 44px;
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-panel-radius);
  padding: var(--rta-space-1) var(--rta-space-2) var(--rta-space-1) var(--rta-space-2);
  background: rgba(128,128,128,.04);
}

.rta-configurator .rta-dependencies__row .rta-dependencies__item:is(:focus,:focus-visible,:active) {
  outline: none;
  box-shadow: none;
  border: 0;
  background: transparent;
}

.rta-configurator .rta-dependencies__row:has(.rta-dependencies__item:focus-visible) {
  outline: 1px solid var(--rta-card-accent,var(--rta-panel-border));
  outline-offset: 1px;
}

/* Dependencies: canonical source color, actionable unresolved facet. */
.rta-configurator .rta-dependencies__warning {
  color: var(--rta-color-warning);
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-row);
  width: auto;
  height: auto;
  min-height: 23px;
  padding: var(--rta-space-1) var(--rta-space-3);
  border: 1px solid currentColor;
  border-radius: var(--rta-panel-radius);
  background: transparent;
  box-shadow: none;
  cursor: pointer;
  font: inherit;
}

.rta-configurator .rta-dependencies__warning.is-active {
  background: rgba(223,173,100,.18);
}

.rta-configurator .rta-dependencies__row[hidden] {
  display: none;
}

/* Dependencies: neutral title, secondary description, edit action at bottom right. */
.rta-configurator .rta-dependencies__row .rta-dependencies__item-name {
  color: var(--rta-color-text-highlight);
}

.rta-configurator .rta-dependencies__row .rta-dependencies__item small {
  color: var(--rta-color-warning-muted);
  opacity: 1;
}

.rta-configurator .rta-dependencies__row .rta-config-card__edit {
  align-self: end;
  justify-self: end;
  margin: 0 0 var(--rta-space-1);
}

/* Rule Them'All — runtime-lab.css : Runtime Lab.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* Runtime Lab --------------------------------------------------------- */
.rta-runtime-lab {
  --rta-lab-column-min: 24rem;
  display: grid;
  gap: var(--rta-gap-block);
}

.rta-runtime-lab fieldset {
  margin: 0;
  padding: var(--rta-space-6);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-panel);
}

.rta-runtime-lab__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(min(100%, var(--rta-lab-column-min)),1fr));
  gap: var(--rta-gap-block);
  align-items: end;
}

.rta-runtime-lab__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-row);
  align-items: center;
}

.rta-runtime-state-list {
  display: grid;
  gap: var(--rta-gap-row);
  margin-top: var(--rta-space-6);
}

.rta-runtime-state-list > div {
  display: flex;
  justify-content: space-between;
  gap: var(--rta-gap-block);
  padding: var(--rta-space-4) var(--rta-space-5);
  border: 1px solid var(--rta-color-border-secondary);
  border-radius: var(--rta-radius-compact);
}

.rta-runtime-state-list span {
  opacity: 0.8;
  text-align: right;
}

.rta-runtime-result {
  padding: var(--rta-space-6);
  border: 1px solid var(--rta-color-border-highlight);
  border-radius: var(--rta-radius-panel);
}

.rta-runtime-result h3 {
  margin: 0 0 var(--rta-space-3);
  font-size: var(--rta-type-medium);
}

/* The tone colors only the result's edge: the text stays readable in every theme. */
.rta-runtime-result[data-tone="success"] { border-color: var(--rta-color-success); }
.rta-runtime-result[data-tone="failure"] { border-color: var(--rta-color-warning); }
.rta-runtime-result[data-tone="error"] { border-color: var(--rta-color-danger); }

.rta-runtime-result__message {
  margin: 0 0 var(--rta-gap-row);
  font-size: var(--rta-type-medium);
  font-weight: 700;
}

.rta-runtime-result__rows {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--rta-gap-tight) var(--rta-gap-block);
  margin: 0;
}

.rta-runtime-result__rows dt { opacity: .72; }
.rta-runtime-result__rows dd { margin: 0; }

.rta-runtime-result__list {
  margin: 0;
  padding-inline-start: var(--rta-space-6);
}

/* Guided Runtime Lab ------------------------------------------ */
.rta-runtime-lab--guided {
  gap: var(--rta-gap-row);
}

.rta-lab-step {
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-panel);
  padding: var(--rta-space-6);
  background: rgba(255,255,255,.015);
}

.rta-lab-step > header {
  display: flex;
  gap: var(--rta-gap-row);
  align-items: flex-start;
  margin-bottom: var(--rta-space-5);
}

.rta-lab-step > header h3 {
  margin: 0;
  font-size: var(--rta-type-medium);
}

.rta-lab-step > header p {
  margin: var(--rta-gap-tight) 0 0;
  opacity: .72;
}

.rta-lab-step__number {
  display: grid;
  place-items: center;
  flex: 0 0 1.65rem;
  width: 1.65rem;
  height: 1.65rem;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-weight: 700;
}

.rta-lab-editing {
  margin-bottom: var(--rta-gap-block);
}

.rta-runtime-state-editor {
  display: grid;
  gap: var(--rta-gap-row);
  max-height: 18rem;
  overflow: auto;
}

.rta-runtime-state-row {
  display: grid;
  grid-template-columns: minmax(9rem,1fr) minmax(12rem,2fr) auto;
  gap: var(--rta-gap-row);
  align-items: center;
  padding: var(--rta-space-4) var(--rta-space-4);
  border: 1px solid var(--rta-color-border-secondary);
  border-radius: var(--rta-radius-control);
}

.rta-runtime-state-row__values {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-row);
  align-items: center;
}

.rta-runtime-state-row__values label {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  margin: 0;
  font-size: .9em;
}

.rta-runtime-state-row__values input[type="number"] {
  width: 5rem;
}

.rta-runtime-state-row__check input {
  margin: 0;
}

.rta-lab-tool-tabs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--rta-gap-row);
  margin-bottom: var(--rta-space-4);
}

.rta-lab-tool-tabs label {
  display: flex;
  gap: var(--rta-gap-tight);
  align-items: center;
  margin: 0;
  padding: var(--rta-space-3) var(--rta-space-4);
  border: 1px solid var(--rta-color-border-secondary);
  border-radius: var(--rta-radius-control);
  cursor: pointer;
}

.rta-lab-tool-tabs__label {
  opacity: .8;
}

.rta-lab-tool-tabs input {
  margin: 0;
}

.rta-lab-guide {
  margin: var(--rta-space-3) 0 var(--rta-space-5);
  opacity: .8;
}

.rta-lab-run {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-row);
  align-items: center;
}

.rta-lab-run > .rta-form-row {
  flex: 1 1 100%;
}

.rta-lab-step--result .rta-runtime-result {
  margin: 0;
}

@container rta-window (max-width: 686px) {
  .rta-runtime-state-row {
    grid-template-columns: 1fr;
  }
}

/* Rule Them'All — sheet-builder.css : Constructeur de fiches.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* The editor shows the played sheet (sheet.css) with sample values: a click selects a block. While editing, the
   tools (toolbar, the selected block's settings, what can be added) sit in a column beside the sheet and stay in
   view while the sheet scrolls; in a narrow window they go above it. */
.rta-sheet-editor {
  container: rta-sheet-editor / inline-size;
}

.rta-sheet-editor__body {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

/* The entry window's scroll area is the height the side column may take. */
.rta-config-entry__scroll:has(.rta-sheet-editor__body--editing) {
  container: rta-entry-scroll / size;
}

.rta-sheet-editor__side {
  --rta-form-label-column-min: 6rem;
  --rta-form-label-column-max: 7rem;
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  min-inline-size: 0;
}

@container rta-sheet-editor (inline-size >= 720px) {
  .rta-sheet-editor__body--editing {
    display: grid;
    grid-template-columns: minmax(16rem, 20rem) minmax(0, 1fr);
    align-items: start;
  }

  .rta-sheet-editor__side {
    position: sticky;
    inset-block-start: 0;
    max-block-size: 100cqb;
    overflow-y: auto;
    scrollbar-gutter: stable;
  }
}

.rta-sheet-editor__toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--rta-gap-tight);
}

/* "View as": the preview as one person sees it; the tree is not changed. */
.rta-sheet-editor__view-as {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  white-space: nowrap;
}

.rta-sheet-editor__view-as > select {
  inline-size: auto;
}

.rta-sheet-editor__toolbar > button:not(.rta-config-action) {
  flex: 0 0 auto;
  inline-size: auto;
  margin-inline-start: auto;
}

/* What can be added: blocks, then the Ruleset's elements, each a small chip that can be clicked or dragged. */
.rta-sheet-editor__palette {
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-panel);
}

.rta-sheet-editor__palette > summary {
  cursor: pointer;
  font-weight: 600;
}

.rta-sheet-editor__palette[open] > summary {
  margin-block-end: var(--rta-gap-row);
}

.rta-sheet-editor__palette > :not(summary) + :not(summary) {
  margin-block-start: var(--rta-gap-row);
}

.rta-sheet-editor__palette-group[hidden] {
  display: none;
}

.rta-sheet-editor__palette-title {
  margin: 0 0 var(--rta-gap-tight);
  color: var(--rta-color-text-secondary);
  font-size: var(--rta-type-sm);
}

.rta-sheet-editor__palette-items {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-tight);
}

.rta-sheet-editor__palette-item {
  display: inline-flex;
  flex: 0 1 auto;
  align-items: center;
  gap: var(--rta-gap-tight);
  inline-size: auto;
  max-inline-size: 100%;
  min-inline-size: 0;
  padding: var(--rta-gap-tight) var(--rta-gap-row);
  border: var(--rta-frame-border) solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-control);
  background: var(--rta-color-surface-option-light);
  cursor: grab;
  user-select: none;
}

.rta-sheet-editor__palette-item:hover,
.rta-sheet-editor__palette-item:focus-visible {
  border-color: var(--rta-color-border-highlight);
}

.rta-sheet-editor__palette-item[hidden] {
  display: none;
}

.rta-sheet-editor__palette-item > span {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rta-sheet-editor__canvas {
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) dashed var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-panel);
}

.rta-sheet-editor__properties {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-panel);
}

.rta-sheet-editor__hint {
  margin: 0;
  color: var(--rta-color-text-secondary);
}

.rta-sheet--edit [data-layout-node] {
  cursor: pointer;
}

/* A block not everyone sees: outlined, an eye struck through in its corner. */
.rta-sheet--edit [data-layout-seen-by] {
  position: relative;
  outline: 1px dashed var(--rta-color-warning);
  outline-offset: 2px;
}

.rta-sheet--edit [data-layout-seen-by]::after {
  content: "\f070";
  position: absolute;
  inset-block-start: 0;
  inset-inline-end: 0;
  font-family: var(--font-awesome);
  font-weight: 900;
  font-size: var(--rta-type-sm);
  color: var(--rta-color-warning);
  pointer-events: none;
}

.rta-sheet--edit [data-layout-node]:hover {
  outline: 1px dashed var(--rta-color-border-highlight);
  outline-offset: 2px;
}

.rta-sheet--edit [data-layout-node][data-layout-selected],
.rta-sheet--edit [data-layout-drop-target="into"] {
  outline: 2px solid var(--rta-color-border-highlight);
  outline-offset: 2px;
}

/* Dropped next to a block: a line shows where it lands. */
.rta-sheet--edit [data-layout-drop-target="before"] {
  box-shadow: 0 -3px 0 var(--rta-color-border-highlight);
}

.rta-sheet--edit [data-layout-drop-target="after"] {
  box-shadow: 0 3px 0 var(--rta-color-border-highlight);
}

/* Inside the editor the sheet's own controls do nothing: a click reaches the block around them. */
.rta-sheet--edit :is(input, select, button):not([data-layout-node]) {
  pointer-events: none;
}

.rta-sheet--edit .rta-sheet-grid[data-layout-node] {
  padding: var(--rta-space-2);
}

.rta-sheet-drop {
  padding: var(--rta-space-4);
  border: var(--rta-frame-border) dashed var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-control);
  color: var(--rta-color-text-secondary);
  text-align: center;
}

/* The Style group of the selected block: folded until opened, it stays open while the GM works in it. */
.rta-sheet-editor__style {
  border-block-start: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  padding-block-start: var(--rta-gap-row);
}

.rta-sheet-editor__style > summary {
  cursor: pointer;
  font-weight: 600;
}

.rta-sheet-editor__style-body {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  padding-block-start: var(--rta-gap-row);
}

.rta-sheet-editor__style-body > button {
  flex: 0 0 auto;
  align-self: flex-start;
  inline-size: auto;
}

.rta-sheet-editor__file {
  display: flex;
  flex: 1;
  align-items: center;
  gap: var(--rta-gap-tight);
  min-inline-size: 0;
}

.rta-sheet-editor__file > input {
  flex: 1;
  min-inline-size: 0;
}

.rta-sheet-editor__checks {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--rta-gap-block);
}

.rta-sheet-editor__check {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-tight);
}

.rta-sheet-editor__properties input[type="color"] {
  inline-size: 4rem;
  padding: 0;
}

.rta-sheet-editor__properties input[type="range"] {
  flex: 1;
}

.rta-sheet-editor__palette-search > input {
  inline-size: 100%;
}

.rta-sheet-editor__wide {
  flex: 0 0 auto;
  align-self: flex-start;
  inline-size: auto;
}

/* The icon typed for a label, shown next to its field. */
.rta-sheet-editor__icon-preview {
  flex: none;
  inline-size: 1.25em;
  text-align: center;
}

/* Rule Them'All — sheet.css : Feuilles jouées (Acteurs et Objets) et carte de chat des Actions.
   L'ordre de chargement (module.json "styles") fait partie de la cascade.
   Les blocs se rangent en colonnes (--rta-sheet-columns) ; un bloc en occupe --rta-sheet-span.
   Sous 480 px de large, tout passe sur une colonne. */
.rta-sheet {
  container: rta-sheet / inline-size;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-block-size: 0;
  gap: var(--rta-gap-block);
  color: var(--rta-color-text);
}

.rta-sheet__header {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-block);
}

.rta-sheet__image {
  inline-size: 64px;
  block-size: 64px;
  object-fit: cover;
  border: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-control);
}

.rta-sheet__name {
  flex: 1;
  margin: 0;
  font-size: var(--rta-type-display);
}

.rta-sheet__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-block-size: 0;
  gap: var(--rta-gap-block);
  /* Foundry's .window-content hides what overflows: the body scrolls under the fixed header. */
  overflow-y: auto;
  scrollbar-gutter: stable;
}

.rta-sheet-grid {
  display: grid;
  grid-template-columns: repeat(var(--rta-sheet-columns, 1), minmax(0, 1fr));
  gap: var(--rta-gap-row);
  align-items: start;
}

/* Not inherited: a block spans its parent's columns, never its own children's. */
@property --rta-sheet-span {
  syntax: "<integer>";
  inherits: false;
  initial-value: 1;
}

.rta-sheet-grid > * {
  grid-column: span var(--rta-sheet-span);
}

/* A value in a block measures its own cell: too narrow, its label goes above the control. */
.rta-sheet-grid > .rta-sheet-value {
  container: rta-sheet-value / inline-size;
}

.rta-sheet-section {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-panel);
  background: var(--rta-color-surface-option-light);
}

.rta-sheet-section__title {
  margin: 0;
  border: 0;
  font-size: var(--rta-type-heading);
}

.rta-sheet-tabs {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

.rta-sheet-tab[hidden] {
  display: none;
}

.rta-sheet-tabs__nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-tight);
  border-block-end: var(--rta-frame-border) solid var(--rta-color-border-subtle);
}

.rta-sheet-tabs__tab {
  flex: 0 0 auto;
  inline-size: auto;
  border: 0;
  border-block-end: 2px solid transparent;
  border-radius: 0;
  background: none;
}

.rta-sheet-tabs__tab[aria-selected="true"] {
  border-block-end-color: var(--rta-color-border-highlight);
  font-weight: 600;
}

.rta-sheet-list {
  display: grid;
  grid-template-columns: var(--rta-sheet-list-template);
  gap: var(--rta-gap-tight) var(--rta-gap-block);
  align-items: center;
}

.rta-sheet-row {
  display: grid;
  grid-column: span var(--rta-sheet-cells);
  grid-template-columns: subgrid;
  column-gap: var(--rta-gap-row);
  align-items: center;
  padding-block: var(--rta-space-2);
  border-block-end: 1px solid var(--rta-color-border-tertiary);
}

.rta-sheet-row--head {
  border-block-end-color: var(--rta-color-border-subtle);
  color: var(--rta-color-text-secondary);
  font-size: var(--rta-type-sm);
}

.rta-sheet-row__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rta-sheet-row__head {
  text-align: center;
  white-space: nowrap;
}

.rta-sheet-value__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  min-inline-size: 0;
}

.rta-sheet-value__label {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--rta-color-text-secondary);
}

.rta-sheet-value__control {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: var(--rta-gap-tight);
}

.rta-sheet-value__control > input:not([type="checkbox"]) {
  inline-size: 4.5rem;
  text-align: end;
}

.rta-sheet-value__control > input[type="text"] {
  inline-size: 9rem;
  text-align: start;
}

.rta-sheet-value__text {
  font-weight: 600;
}

.rta-sheet-value__bound {
  color: var(--rta-color-text-secondary);
}

.rta-sheet-value--unavailable {
  opacity: .6;
}

.rta-sheet-visually-hidden {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.rta-sheet-action {
  inline-size: 100%;
}

/* A label's icon, before its text when both show. */
.rta-sheet-icon + span:not(.rta-sheet-visually-hidden) {
  margin-inline-start: var(--rta-gap-tight);
}

.rta-sheet-text,
.rta-sheet-empty {
  margin: 0;
}

.rta-sheet-empty {
  color: var(--rta-color-text-secondary);
  font-style: italic;
}

.rta-sheet-notice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--rta-gap-row);
}

.rta-sheet-notice__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-row);
}

.rta-sheet-notice__actions > button,
.rta-sheet__command {
  flex: 0 0 auto;
  inline-size: auto;
}

.rta-sheet-notice__primary {
  border-color: var(--rta-color-border-highlight);
  font-weight: 600;
}

/* The Contents an Actor holds: a picture, a name that opens the Item, a button that removes it. */
.rta-sheet-contents {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

.rta-sheet-contents__type {
  margin: 0;
  color: var(--rta-color-text-secondary);
  font-size: var(--rta-type-sm);
  text-transform: uppercase;
}

.rta-sheet-contents__list {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  margin: 0;
  padding: 0;
  list-style: none;
}

.rta-sheet-content {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  padding-block: var(--rta-space-2);
  border-block-end: 1px solid var(--rta-color-border-tertiary);
}

.rta-sheet-content--unavailable {
  opacity: .6;
}

.rta-sheet-content__image {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  inline-size: 28px;
  block-size: 28px;
  object-fit: cover;
  border: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-compact);
  color: var(--rta-color-text-secondary);
}

.rta-sheet-content__name {
  flex: 1;
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: start;
}

button.rta-sheet-content__name {
  justify-content: flex-start;
  inline-size: auto;
  border: 0;
  background: none;
  padding: 0;
}

.rta-sheet-content__remove {
  flex: 0 0 auto;
  inline-size: auto;
  border: 0;
  background: none;
  color: var(--rta-color-text-secondary);
}

.rta-sheet--drop .rta-sheet-contents {
  outline: 2px dashed var(--rta-color-border-highlight);
  outline-offset: 4px;
}

/* A Progression System's purchases: one line per Definition (name, from → to, cost, button), its columns lined up. */
.rta-sheet-progression {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-block);
}

.rta-sheet-progression__group {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

.rta-sheet-progression__title {
  display: flex;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  margin: 0;
  color: var(--rta-color-text-secondary);
  font-size: var(--rta-type-sm);
  text-transform: uppercase;
}

.rta-sheet-progression__funds {
  font-weight: 600;
  text-transform: none;
}

.rta-sheet-progression__list,
.rta-sheet-progression__milestones {
  margin: 0;
  padding: 0;
  list-style: none;
}

.rta-sheet-progression__list {
  display: grid;
  /* The last column keeps one width in every group, so the buttons line up from one advancement to the next. */
  grid-template-columns: minmax(0, 1fr) auto auto minmax(6rem, auto);
  column-gap: var(--rta-gap-row);
  align-items: center;
}

.rta-sheet-progression__row {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  padding-block: var(--rta-gap-tight);
  border-block-end: 1px solid var(--rta-color-border-tertiary);
}

.rta-sheet-progression__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rta-sheet-progression__step,
.rta-sheet-progression__cost {
  text-align: end;
  white-space: nowrap;
}

.rta-sheet-progression__step {
  font-weight: 600;
}

.rta-sheet-progression__cost,
.rta-sheet-progression__reason,
.rta-sheet-progression__state {
  color: var(--rta-color-text-secondary);
}

.rta-sheet-progression__reason {
  font-size: var(--rta-type-sm);
  font-style: italic;
  text-align: end;
}

.rta-sheet-progression__button {
  inline-size: auto;
  white-space: nowrap;
}

.rta-sheet-progression__row > .rta-sheet-progression__button {
  inline-size: 100%;
}

.rta-sheet-progression__group > .rta-sheet-progression__button {
  align-self: flex-start;
}

.rta-sheet-progression__milestone {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  padding-block: var(--rta-gap-tight);
}

.rta-sheet-progression__state {
  margin-inline-start: auto;
  font-size: var(--rta-type-sm);
}

.rta-sheet-progression__milestone--reached {
  font-weight: 600;
}

.rta-sheet-progression__milestone--reached > i {
  color: var(--rta-color-border-highlight);
}

.rta-sheet-progression__milestone--ahead {
  color: var(--rta-color-text-secondary);
}

/* In the editor the buttons are marks drawn like buttons. */
span.rta-sheet-progression__button {
  display: inline-flex;
  align-items: center;
  min-block-size: var(--input-height, 1.75rem);
  padding: 0 var(--rta-gap-row);
  border: var(--rta-frame-border) solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-control);
}

/* Styles set in the sheet editor (inline, from ui/sheet-style.mjs). A colored block colors its labels and titles too. */
.rta-sheet-colored :is(.rta-sheet-value__label, .rta-sheet-row__label, .rta-sheet-row__head, .rta-sheet-section__title, .rta-sheet-contents__type, .rta-sheet-value__bound) {
  color: inherit;
}

.rta-sheet-fonted :is(.rta-sheet-section__title, .rta-sheet-tabs__tab, .rta-sheet-action) {
  font-family: inherit;
}

.rta-sheet-align-center > .rta-sheet-value__inner {
  justify-content: center;
}

.rta-sheet-align-end > .rta-sheet-value__inner {
  justify-content: flex-end;
}

.rta-sheet-align-center .rta-sheet-value__control > input:not([type="checkbox"]) {
  text-align: center;
}

.rta-sheet-align-start .rta-sheet-value__control > input:not([type="checkbox"]) {
  text-align: start;
}

.rta-sheet-value--label-top > .rta-sheet-value__inner {
  flex-direction: column;
  align-items: stretch;
  gap: var(--rta-gap-tight);
}

.rta-sheet-value--label-top .rta-sheet-value__control > input:not([type="checkbox"]) {
  inline-size: 100%;
}

.rta-sheet-value--label-hidden .rta-sheet-value__label {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.rta-sheet-value--label-hidden > .rta-sheet-value__inner {
  justify-content: center;
}

.rta-sheet-image {
  display: flex;
  align-items: center;
  justify-content: center;
  block-size: var(--rta-sheet-image-height);
  overflow: hidden;
}

.rta-sheet-image--rounded {
  border-radius: var(--rta-radius-panel);
}

/* A shape keeps its proportions at the chosen height, centred in its cell: a portrait, a token, a map. */
.rta-sheet-image:is(.rta-sheet-image--square, .rta-sheet-image--portrait, .rta-sheet-image--landscape, .rta-sheet-image--circle) {
  justify-self: center;
  inline-size: auto;
  max-inline-size: 100%;
  aspect-ratio: var(--rta-sheet-image-ratio);
}

.rta-sheet-image--square,
.rta-sheet-image--circle {
  --rta-sheet-image-ratio: 1;
}

.rta-sheet-image--portrait {
  --rta-sheet-image-ratio: 3 / 4;
}

.rta-sheet-image--landscape {
  --rta-sheet-image-ratio: 4 / 3;
}

.rta-sheet-image--circle {
  border-radius: 50%;
}

.rta-sheet-image > img {
  inline-size: 100%;
  block-size: 100%;
  object-fit: var(--rta-sheet-image-fit);
  border: 0;
}

.rta-sheet-image--empty {
  gap: var(--rta-gap-row);
  border: var(--rta-frame-border) dashed var(--rta-color-border-tertiary);
  color: var(--rta-color-text-secondary);
}

.rta-sheet-choice {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

.rta-chat-card {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

.rta-chat-card__title {
  display: flex;
  justify-content: space-between;
  gap: var(--rta-gap-row);
}

.rta-chat-card__lines {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--rta-gap-tight);
  margin: 0;
}

.rta-chat-card__lines > dd {
  margin: 0;
  text-align: end;
  font-weight: 600;
}

.rta-chat-card__outcome {
  margin: 0;
  font-weight: 600;
}

@container rta-sheet (max-width: 600px) {
  .rta-sheet-list {
    grid-template-columns: var(--rta-sheet-list-medium);
  }

  .rta-sheet-row--head:nth-child(n + 3) {
    display: none;
  }
}

@container rta-sheet (max-width: 480px) {
  .rta-sheet-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .rta-sheet-list {
    grid-template-columns: var(--rta-sheet-list-narrow);
  }

  .rta-sheet-row--head + .rta-sheet-row--head {
    display: none;
  }

  .rta-sheet-grid > * {
    grid-column: auto;
  }
}

@container rta-sheet-value (max-width: 10rem) {
  .rta-sheet-value__inner {
    flex-direction: column;
    align-items: stretch;
    gap: var(--rta-gap-tight);
  }

  .rta-sheet-value__control > input:not([type="checkbox"]) {
    inline-size: 100%;
  }
}

/* A value as dots (a characteristic from 0 to 5) or as a gauge (Health 8 / 12). */
.rta-sheet-dots {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--rta-gap-tight);
}

.rta-sheet-dot {
  flex: 0 0 auto;
  inline-size: 0.9rem;
  block-size: 0.9rem;
  min-block-size: 0;
  margin: 0;
  padding: 0;
  border: var(--rta-frame-border) solid var(--rta-sheet-fill-solid, var(--rta-color-border-highlight));
  border-radius: 50%;
  background: none;
}

.rta-sheet-dot--on {
  background: var(--rta-sheet-fill-solid, var(--rta-color-border-highlight));
}

button.rta-sheet-dot {
  cursor: pointer;
}

.rta-sheet-gauge {
  position: relative;
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  min-inline-size: 6rem;
  block-size: 1.4rem;
  overflow: hidden;
  border: var(--rta-frame-border) solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-control);
}

/* The fill spans the whole bar and is cut at the value: a gradient keeps its colors where they are (half full shows the first half). */
.rta-sheet-gauge__fill {
  position: absolute;
  inset: 0;
  clip-path: inset(0 calc(100% - var(--rta-gauge-share, 0%)) 0 0);
  background: var(--rta-sheet-fill, var(--rta-color-border-highlight));
  opacity: var(--rta-sheet-fill-opacity, .45);
}

/* A color chosen for the gauge shows at full strength. */
[style*="--rta-sheet-fill"] .rta-sheet-gauge__fill {
  --rta-sheet-fill-opacity: .85;
}

.rta-sheet-gauge__text {
  position: relative;
  font-size: var(--rta-type-sm);
  font-weight: 600;
}

/* In the editor, Action buttons and tabs are plain blocks (they must be draggable): they keep their look. */
.rta-sheet--edit div.rta-sheet-action {
  display: flex;
  align-items: center;
  justify-content: center;
  min-block-size: var(--input-height, 1.75rem);
  padding: 0 var(--rta-gap-row);
  border: var(--rta-frame-border) solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-control);
}

.rta-sheet--edit div.rta-sheet-tabs__tab {
  padding: var(--rta-gap-tight) var(--rta-gap-row);
}

.rta-sheet-value__control:has(> .rta-sheet-gauge) {
  flex: 1;
}

/* − and + of a value that goes both ways, around the amount. */
.rta-sheet-value__step {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  inline-size: var(--input-height, 1.75rem);
  block-size: var(--input-height, 1.75rem);
  padding: 0;
}

/* In the editor the − and + are marks drawn like the buttons. */
span.rta-sheet-value__step {
  border: var(--rta-frame-border) solid var(--rta-color-border-highlight);
  border-radius: var(--rta-radius-control);
}

/* Rule Them'All — creation.css : Création de personnage en jeu (fenêtre pas à pas).
   L'ordre de chargement (module.json "styles") fait partie de la cascade.
   Les étapes à gauche, l'étape en cours à droite ; sous 560 px, les étapes passent au-dessus. */
.rta-creation {
  container: rta-creation / inline-size;
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: var(--rta-gap-block);
  min-block-size: 0;
  color: var(--rta-color-text);
}

/* Foundry's .window-content hides what overflows: the steps and the step in progress scroll, the footer stays. */
.rta-creation__layout {
  display: grid;
  flex: 1;
  min-block-size: 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
  grid-template-columns: minmax(10rem, 14rem) minmax(0, 1fr);
  gap: var(--rta-gap-block);
  align-items: start;
}

.rta-creation__steps {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  margin: 0;
  padding: 0;
  list-style: none;
}

.rta-creation__step {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: var(--rta-gap-row);
  inline-size: 100%;
  border: var(--rta-frame-border) solid transparent;
  border-radius: var(--rta-radius-control);
  background: none;
  text-align: start;
}

.rta-creation__step[aria-current="step"] {
  border-color: var(--rta-color-border-highlight);
  background: var(--rta-color-surface-option-light);
  font-weight: 600;
}

.rta-creation__step[data-state="skipped"] {
  opacity: .6;
}

.rta-creation__number {
  display: inline-grid;
  flex: 0 0 auto;
  place-items: center;
  inline-size: 1.5rem;
  block-size: 1.5rem;
  border: var(--rta-frame-border) solid var(--rta-color-border-tertiary);
  border-radius: 50%;
  font-size: var(--rta-type-sm);
}

.rta-creation__step[data-state="done"] .rta-creation__number {
  border-color: var(--rta-color-success);
  color: var(--rta-color-success);
}

.rta-creation__step[data-state="error"] .rta-creation__number {
  border-color: var(--rta-color-danger);
  color: var(--rta-color-danger);
}

.rta-creation__step-label {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rta-creation__panel,
.rta-creation__section {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-color-border-subtle);
  border-radius: var(--rta-radius-panel);
  background: var(--rta-color-surface-option-light);
}

.rta-creation__panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--rta-gap-row);
}

.rta-creation__title {
  margin: 0;
  border: 0;
  font-size: var(--rta-type-heading);
}

.rta-creation__term,
.rta-creation__hint {
  margin: 0;
  color: var(--rta-color-text-secondary);
}

.rta-creation__options {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
  gap: var(--rta-gap-tight) var(--rta-gap-block);
}

.rta-creation__option {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  min-inline-size: 0;
}

.rta-creation__option > span {
  min-inline-size: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rta-creation__group {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  margin: 0;
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-panel);
}

.rta-creation__points {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
  gap: var(--rta-gap-tight) var(--rta-gap-block);
}

.rta-creation__point,
.rta-creation__name,
.rta-creation__draft {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
}

.rta-creation__value {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: var(--rta-gap-tight);
}

/* The −/+ buttons replace the browser's own arrows. */
.rta-creation__value > input {
  inline-size: 3.5rem;
  text-align: center;
  appearance: textfield;
}

.rta-creation__value > input::-webkit-inner-spin-button,
.rta-creation__value > input::-webkit-outer-spin-button {
  appearance: none;
  margin: 0;
}

.rta-creation__stepper {
  display: inline-grid;
  flex: 0 0 auto;
  place-items: center;
  inline-size: var(--input-height, 1.75rem);
  block-size: var(--input-height, 1.75rem);
  padding: 0;
  line-height: 1;
}

.rta-creation__stepper:disabled {
  opacity: .4;
  cursor: default;
}

.rta-creation__name > span {
  flex: 0 0 8rem;
}

.rta-creation__name > :is(input, select) {
  flex: 1;
}

.rta-creation__roll {
  margin: 0;
  font-size: var(--rta-type-heading);
}

.rta-creation__summary {
  display: grid;
  grid-template-columns: minmax(8rem, max-content) minmax(0, 1fr);
  gap: var(--rta-gap-tight) var(--rta-gap-block);
  margin: 0;
}

.rta-creation__summary > dt {
  color: var(--rta-color-text-secondary);
}

.rta-creation__summary > dd {
  margin: 0;
}

.rta-creation__errors {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  margin: 0;
  padding-inline-start: var(--rta-frame-pad);
  color: var(--rta-color-danger);
}

.rta-creation__tools,
.rta-creation__footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--rta-gap-row);
}

.rta-creation__tools > button,
.rta-creation__footer > button,
.rta-creation__draft > button {
  flex: 0 0 auto;
  inline-size: auto;
}

.rta-creation__draft > span {
  flex: 1;
  min-inline-size: 0;
}

.rta-creation__primary {
  font-weight: 600;
}

.rta-creation__spacer {
  flex: 1;
}

.rta-creation__drafts {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  margin: 0;
  padding: 0;
  list-style: none;
}

@container rta-creation (inline-size < 560px) {
  .rta-creation__layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .rta-creation__steps {
    flex-flow: row wrap;
  }

  .rta-creation__step {
    inline-size: auto;
  }
}

/* Rule Them'All — editor.css : Fenêtres d'édition : sections, form-row canonique, champs.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* Rule Them'All Configurator: Foundry-first layout refinements only. */
.rta-configurator,
.rta-config-entry {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.rta-configurator__scroll,
.rta-config-entry__scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
}

.rta-config-entry form[data-entry-form] {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}


.rta-config-entry textarea {
  resize: vertical;
}

.rta-config-entry__full-width {
  display: flex;
  flex-direction: column;
}

.rta-config-entry__full-width > label {
  margin: 0;
}

.rta-config-entry__full-width > textarea {
  width: 100%;
  min-width: 0;
}

.rta-config-entry__footer-actions {
  margin-inline-start: auto;
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
}

.rta-config-entry dl,
.rta-configurator dl {
  display: grid;
  grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
  gap: var(--rta-gap-row) var(--rta-gap-block);
}

.rta-config-entry dl dt,
.rta-config-entry dl dd,
.rta-configurator dl dt,
.rta-configurator dl dd {
  margin: 0;
}

/* editor spacing, disclosure and selectors. */

.rta-config-entry__section > summary {
  cursor: pointer;
  font-weight: 700;
  padding-block: var(--rta-space-3);
}

.rta-config-entry__section-summary {
  margin-inline-start: var(--rta-space-4);
  color: var(--rta-color-text-secondary);
  font-size: 0.82em;
  font-weight: 400;
  opacity: 0.82;
  overflow: hidden;
  white-space: nowrap;
}

.rta-config-entry__check-group {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  max-height: 12rem;
  overflow: auto;
  padding: var(--rta-space-4) var(--rta-space-2);
}

.rta-config-entry__check-group--inline {
  max-height: 9rem;
}

.rta-config-entry__check-group > label {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
}

.rta-config-entry__projection {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

.rta-config-entry__empty {
  opacity: 0.7;
  font-style: italic;
}

.rta-config-entry__enabled {
  margin-block-start: var(--rta-space-5);
}

/* generic DefinitionType field editor and generated Definition data editor. */
.rta-config-entry__section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-block);
}

.rta-field-editor-list,
.rta-definition-data-grid,
.rta-capability-contracts {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

.rta-field-editor,
.rta-definition-field {
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-compact);
  padding: var(--rta-space-5);
  background: color-mix(in srgb, var(--rta-color-surface) 12%, transparent);
}

.rta-field-editor > header,
.rta-definition-field__heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  margin-block-end: var(--rta-space-4);
}

.rta-field-editor__grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--rta-gap-row) var(--rta-gap-block);
}

.rta-field-editor label,
.rta-definition-field {
  min-width: 0;
}

.rta-field-editor label:not(.rta-field-editor__check):not(.rta-form-row__label):not(.rta-form-row--nested):not([data-picker-option]) {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

.rta-field-editor input:not([type="checkbox"]):not([type="radio"]),
.rta-field-editor select,
.rta-field-editor textarea,
.rta-definition-field input,
.rta-definition-field select,
.rta-definition-field textarea {
  width: 100%;
  min-width: 0;
}

.rta-field-editor__check,
.rta-definition-field__use {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
}

.rta-field-editor__check input,
.rta-definition-field__use input {
  width: auto;
}

.rta-field-editor > details {
  margin-block-start: var(--rta-space-4);
}

.rta-field-editor > details > label {
  margin-block: var(--rta-space-4);
}

.rta-definition-field {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--rta-gap-row);
}

.rta-definition-field__heading small {
  opacity: 0.72;
}

.rta-capability-contracts > details {
  padding: var(--rta-space-3) var(--rta-space-4);
  border-left: 2px solid var(--rta-color-border);
}

@container rta-window (max-width: 666px) {
  .rta-field-editor__grid {
    grid-template-columns: 1fr;
  }
}

.rta-field-editor__details > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-4) var(--rta-space-5);
  cursor: pointer;
  list-style: none;
}

.rta-field-editor__details > summary::-webkit-details-marker {
  display: none;
}

.rta-field-editor__details > summary::before {
  content: "▸";
  flex: 0 0 auto;
}

.rta-field-editor__details[open] > summary::before {
  content: "▾";
}

.rta-field-editor__details > summary > span {
  flex: 1;
  min-width: 0;
}

.rta-field-editor__details > summary small {
  opacity: .7;
  font-weight: normal;
}

.rta-field-editor__numeric {
  display: grid;
  grid-template-columns: minmax(0,1fr);
  gap: var(--rta-gap-row) var(--rta-gap-block);
  margin: var(--rta-space-5) 0;
}

.rta-field-editor__numeric label {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
}

@container rta-window (max-width: 666px) {
  .rta-configurator__workspace-header > div:first-of-type {
    justify-content: flex-start;
  }
  .rta-field-editor__numeric {
    grid-template-columns: 1fr;
  }
}

/* No IDs UI: business-first pickers and compact Definition fields. */
.rta-definition-field.form-group {
  border: 0;
  border-radius: 0;
  padding: 0;
  background: transparent;
}

.rta-definition-field.form-group > label {
  font-weight: 600;
}

.rta-config-entry__technical details > textarea,
.rta-config-entry__technical > textarea {
  width: 100%;
  min-height: 8rem;
}

/* clearer field cards, collapsible relationship pickers, visual rule builders. */
.rta-field-editor {
  padding: 0;
  overflow: hidden;
  margin-block: 0;
  border: var(--rta-frame-border) solid var(--rta-color-border);
  border-radius: var(--rta-radius-panel);
  box-shadow: 0 0 0 1px rgba(255,255,255,.035);
  background: rgba(255,255,255,.018);
}

.rta-field-editor__body {

/* reuse existing entry/field components; only align section title actions. */

/* Canonical entry-window presentation.
   ONE scoped editor contract, reusing Foundry form controls and the existing
   Configurator palette. All entry kinds inherit this; no per-kind theme.
   Preserve functional layouts (grids, pickers, sheet builder) and native focus. */
.rta-config-entry__scroll {

/* The fieldset, details section and dynamic field card are three native

.rta-config-entry :is(fieldset, details.rta-config-entry__section, .rta-field-editor) {

.rta-config-entry fieldset {

.rta-config-entry details.rta-config-entry__section > summary {

  line-height: 1.3;
}

.rta-config-entry details.rta-config-entry__section[open] {
  padding-bottom: var(--rta-space-6);
}

.rta-config-entry details.rta-config-entry__section[open] > summary {
  border-bottom: 1px solid var(--rta-editor-border);
}

.rta-config-entry .rta-field-editor {
  padding: 0;
  overflow: hidden;
}

.rta-config-entry .rta-field-editor__details > summary {
  padding: var(--rta-space-5) var(--rta-frame-pad);
  min-height: 2.3rem;
}

/* The card border plus this padding is exactly one --rta-frame-step. */
.rta-config-entry .rta-field-editor__body {
  padding: var(--rta-frame-pad);
  background: transparent;
}

/* Canonical form-stack rhythm, reusable by nested editors. */
.rta-config-entry .rta-form-stack {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

/* Existing Foundry controls keep their native behavior; align only their
   geometry and use the same spacing for grid and nested-label forms. */
.rta-config-entry :is(.form-group, .rta-field-editor__grid, .rta-field-editor__numeric) {

}

.rta-config-entry :is(.form-group > label, .rta-field-editor label, fieldset > label) {

.rta-config-entry :is(input:not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea) {

}

.rta-config-entry :is(.form-group > input:not([type="checkbox"]):not([type="color"]), .form-group > select, .rta-field-editor__grid input:not([type="checkbox"]), .rta-field-editor__grid select) {

.rta-config-entry .form-footer {

/* Delete stays in the footer flow; when the Core would refuse it, the wrapper carries the reason tooltip. */
.rta-config-entry .form-footer .rta-delete-guard {

}

.rta-config-entry .form-footer .rta-delete-guard > button {

}

.rta-config-entry .form-footer .rta-delete-guard > button:disabled {
