  /* ---------------------------------------- */
  /* Notifications                            */
  /* ---------------------------------------- */
  #notifications {
    position: fixed;
    top: 10vh;
    width: 100%;
    margin: 0;
    padding: 0 20%;
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    list-style: none;
    z-index: var(--z-index-notification);
    pointer-events: none;
  }
  #notifications > .notification {
    box-shadow: 0 0 10px black;
  }
  #notifications > .notification::after {
    content: "\f057";
    font-family: var(--font-awesome);
    font-weight: 900;
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    line-height: 16px;
  }
  .notification {
    --border-color: transparent;
    --background-color: rgba(0, 0, 0, 0.5);
    --icon-glyph: "";
    position: relative;
    display: flex;
    align-items: center;
    margin: 0;
    padding: 0.5rem 1rem;
    background: var(--background-color);
    border: 1px solid var(--border-color);
    border-radius: 5px;
    color: var(--color-light-3);
    font-size: var(--font-size-14);
    line-height: 1em;
    text-shadow: 1px 1px black;
    pointer-events: all;
    /** Progress Bars */
    /** Software Update Channels */
  }
  .notification > p {
    margin: 0;
    order: 1;
  }
  .notification > .pct {
    display: none;
    font-weight: bold;
    margin-right: 0.5rem;
    order: 0;
  }
  .notification::before {
    content: var(--icon-glyph);
    font-family: var(--font-awesome);
    font-weight: 900;
    margin-right: 8px;
  }
  .notification.info {
    --icon-glyph: "\f05a";
    --background-color: var(--color-level-info-bg);
    --border-color: var(--color-level-info);
  }
  .notification.warning {
    --background-color: var(--color-level-warning-bg);
    --border-color: var(--color-level-warning);
    --icon-glyph: "\f071";
    color: var(--color-light-2);
  }
  .notification.error {
    --background-color: var(--color-level-error-bg);
    --border-color: var(--color-level-error);
    --icon-glyph: "\f06a";
  }
  .notification.success {
    --background-color: var(--color-level-success-bg);
    --border-color: var(--color-level-success);
    --icon-glyph: "\f00c";
  }
  .notification.progress {
    background: linear-gradient(90deg, var(--background-color) var(--pct), var(--border-color) calc(var(--pct) + 2px), rgba(0, 0, 0, 0.8) calc(var(--pct) + 2px), rgba(0, 0, 0, 0.5) 100%);
  }
  .notification.progress > .pct {
    display: inline-block;
  }
  .notification.channel-hint {
    width: 100%;
    flex: none;
  }
  .notification.stable {
    --background-color: rgba(138, 211, 4, 0.4);
    --icon-glyph: "\f6d9";
  }
  .notification.testing {
    --background-color: rgba(211, 192, 4, 0.4);
    --icon-glyph: "\f0ad";
  }
  .notification.development {
    --background-color: rgba(211, 119, 4, 0.4);
    --icon-glyph: "\f6e3";
  }
  .notification.prototype {
    --background-color: rgba(211, 20, 4, 0.4);
    --icon-glyph: "\f1e2";
  }
  /* ---------------------------------------- */
  /*  Faded Elements                          */
  /* ---------------------------------------- */
  .faded-ui {
    opacity: var(--ui-fade-opacity);
    transition: opacity var(--ui-fade-delay) var(--ui-fade-duration);
  }
  .faded-ui:hover {
    transition: opacity var(--ui-fade-duration);
    opacity: 1;
  }
  .detached .faded-ui {
    opacity: 1;
  }
  /* ----------------------------------------- */
  /*  Placeable Palette                        */
  /* ----------------------------------------- */
  .application.placeable-palette .form-fields {
    flex: 1;
  }
  .application.placeable-palette .form-footer button {
    --button-size: var(--input-height);
  }
  .application.placeable-palette .standard-form {
    gap: var(--spacer-8);
  }
  .application.placeable-palette .standard-form .form-group:first-child {
    margin-top: unset;
  }
  .application.placeable-palette fieldset {
    gap: var(--spacer-8);
    display: contents;
    padding: var(--spacer-4) var(--spacer-12);
  }
  .application.placeable-palette fieldset legend {
    display: none;
  }
  .application.placeable-palette details:focus {
    outline: none;
  }
  .application.placeable-palette details[open] summary {
    display: none;
  }
  .application.placeable-palette details[open] > fieldset {
    display: flex;
  }
  .application.placeable-palette details[open] > fieldset legend {
    display: unset;
  }
  .application.placeable-palette details[open] > fieldset legend::before {
    content: "\f0d7";
    font-family: var(--font-awesome);
    font-weight: bold;
    margin-right: 6px;
  }
  .application.placeable-palette details summary {
    list-style: none;
  }
  .application.placeable-palette details summary::before {
    content: "\f0da";
    font-family: var(--font-awesome);
    font-weight: bold;
    margin-right: 6px;
  }
  .application.placeable-palette .window-content {
    gap: var(--spacer-8);
    padding: var(--spacer-8);
  }
  .application.placeable-palette .multiple-values.placeholder-fa-solid::placeholder {
    font-family: var(--font-body);
  }
  #ambient-sound-palette .constrain-walls > label,
  #ambient-light-palette .constrain-walls > label,
  #ambient-light-filter .constrain-walls > label {
    flex: max-content;
  }
  #region-palette .elevation .form-fields {
    flex: min-content;
  }
  #region-palette color-picker:has(> input[type=text]:placeholder-shown) > input[type=color]::-webkit-color-swatch-wrapper {
    padding: 0;
  }
  #region-palette color-picker:has(> input[type=text]:placeholder-shown) > input[type=color]::-webkit-color-swatch {
    background: conic-gradient(red 0deg 120deg, lime 120deg 240deg, blue 240deg 360deg);
    border: none;
  }
  #region-palette color-picker:has(> input[type=text]:placeholder-shown) > input[type=color]::-moz-color-swatch {
    background: conic-gradient(red 0deg 120deg, lime 120deg 240deg, blue 240deg 360deg);
    border: none;
  }
  /* ---------------------------------------- */
  /* HUD Container                            */
  /* ---------------------------------------- */
  #hud {
    position: absolute;
    transform-origin: top left;
    pointer-events: none;
    z-index: calc(var(--z-index-canvas) + 1);
  }
  #hud > * {
    position: absolute;
    text-align: center;
    pointer-events: none;
    transform-origin: top left;
  }
  /* ---------------------------------------- */
  /* HUD Application                          */
  /* ---------------------------------------- */
  .placeable-hud {
    --column-width: 50px;
    --control-size: 35px;
  }
  .placeable-hud .palette {
    visibility: hidden;
    position: absolute;
    background: var(--control-bg-color);
    border: 1px solid var(--control-border-color);
    border-radius: 4px;
    pointer-events: all;
    box-shadow: 0 0 10px var(--color-shadow-dark);
  }
  .placeable-hud .palette.active {
    visibility: visible;
  }
  .placeable-hud .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: absolute;
    height: 100%;
    gap: 8px;
  }
  .placeable-hud .col.left {
    left: calc(-1 * var(--column-width) - 8px);
    width: var(--column-width);
    justify-content: flex-start;
    align-items: flex-end;
  }
  .placeable-hud .col.left .palette {
    right: calc(var(--column-width) + 8px);
  }
  .placeable-hud .col.middle {
    width: 100%;
    left: 0;
    justify-content: space-between;
  }
  .placeable-hud .col.middle .palette {
    top: -8px;
    transform: translate(0, -100%);
  }
  .placeable-hud .col.right {
    right: calc(-1 * var(--column-width) - 8px);
    width: var(--column-width);
    justify-content: flex-start;
    align-items: flex-start;
  }
  .placeable-hud .col.right .palette {
    left: calc(var(--column-width) + 8px);
  }
  .placeable-hud input[type="text"] {
    --input-background-color: var(--control-bg-color);
    --input-border-color: var(--control-border-color);
    --input-text-color: var(--control-icon-color);
    width: 100%;
    box-shadow: 0 0 10px var(--color-shadow-dark);
    height: var(--control-size);
    line-height: var(--control-size);
    border-radius: 8px;
    font-size: var(--font-size-24);
    font-weight: bold;
    text-align: center;
  }
  .placeable-hud .control-icon {
    flex: 0 0 var(--control-size);
    padding: 4px;
    line-height: var(--control-size);
    font-size: var(--font-size-24);
    box-shadow: 0 0 10px var(--color-shadow-dark);
    border-radius: 4px;
  }
  .placeable-hud .control-icon img {
    width: 100%;
    height: 100%;
    opacity: 0.7;
    filter: var(--control-icon-filter);
  }
  .placeable-hud .control-icon:hover img {
    opacity: 1;
  }
  .placeable-hud .control-icon.active {
    --control-bg-color: var(--control-active-bg-color);
    --control-hover-bg-color: var(--control-active-bg-color);
    --control-border-color: var(--control-active-border-color);
    --control-hover-border-color: var(--control-active-border-color);
    --control-icon-color: var(--control-active-icon-color);
    --control-hover-icon-color: var(--control-active-icon-color);
    outline: none;
    text-shadow: none;
  }
  .placeable-hud .control-icon.active img {
    opacity: 1;
  }
  .placeable-hud .attribute {
    flex: 0 0 var(--control-size);
  }
  .placeable-hud .attribute.elevation {
    color: var(--control-icon-color);
    position: relative;
    width: var(--column-width);
  }
  .placeable-hud .attribute.elevation > .caret {
    position: absolute;
    top: -5px;
    left: -5px;
    font-size: var(--font-size-15);
  }
  .placeable-hud .attribute.elevation input {
    padding: 0;
  }
  /* ---------------------------------------- */
  /* Token HUD                                */
  /* ---------------------------------------- */
  #token-drop {
    opacity: 0.5;
    z-index: calc(var(--z-index-window) + 1);
    border: none;
  }
  #token-hud .col {
    height: calc(100% + 100px);
    top: -50px;
  }
  #token-hud .col.left,
  #token-hud .col.right {
    align-items: center;
    justify-content: center;
  }
  #token-hud .attribute.bar1 {
    bottom: 0;
  }
  #token-hud .attribute.bar1 input {
    border: 1px solid #7cd000;
  }
  #token-hud .attribute.bar2 {
    top: 0;
  }
  #token-hud .attribute.bar2 input {
    border: 1px solid #659db5;
  }
  #token-hud .status-effects {
    --effect-columns: 5;
    --effect-size: 24px;
    --effect-gap: 3px;
    display: grid;
    grid-template-columns: repeat(var(--effect-columns), var(--effect-size));
    max-height: calc(8 * (var(--effect-size) + var(--effect-gap)) + 2 * var(--effect-gap));
    padding: var(--effect-gap);
    gap: var(--effect-gap);
    overflow: hidden auto;
  }
  #token-hud .status-effects .effect-control {
    width: var(--effect-size);
    height: var(--effect-size);
    margin: 0;
    padding: 0;
    border: none;
    opacity: 0.5;
    cursor: var(--cursor-pointer);
  }
  #token-hud .status-effects .effect-control[src$=".svg"] {
    filter: var(--control-icon-filter);
  }
  #token-hud .status-effects .effect-control:hover {
    opacity: 0.7;
  }
  #token-hud .status-effects .effect-control.active {
    opacity: 1;
  }
  #token-hud .status-effects .effect-control.overlay {
    opacity: 1;
    border: 1px solid var(--control-active-border-color);
  }
  #token-hud .palette.palette-list {
    display: flex;
    flex-direction: column;
    width: auto;
    min-width: 140px;
    padding: 3px;
    gap: 3px;
    text-align: left;
    font-size: var(--font-size-13);
    color: var(--control-icon-color);
  }
  #token-hud .palette.palette-list .palette-list-entry {
    flex: 1;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 3px;
    white-space: nowrap;
  }
  #token-hud .palette.palette-list .palette-list-entry:hover {
    color: var(--control-hover-icon-color);
    border-color: var(--control-hover-border-color);
  }
  #token-hud .palette.palette-list .palette-list-entry:hover img {
    opacity: 1;
  }
  #token-hud .palette.palette-list .palette-list-entry.active {
    color: var(--control-active-icon-color);
    border-color: var(--control-active-border-color);
  }
  #token-hud .palette.palette-list .palette-list-entry > span {
    display: inline-flex;
    gap: 4px;
  }
  #token-hud .palette.palette-list .palette-list-entry > span:has(> i) {
    align-items: center;
  }
  #token-hud .palette.palette-list .palette-list-entry img {
    width: 16px;
    height: 16px;
    opacity: 0.7;
    filter: var(--hud-icon-filter, none);
  }
  /* ---------------------------------------- */
  /* Ruler Labels                             */
  /* ---------------------------------------- */
  #measurement {
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #measurement .ruler-labels {
    width: 100%;
    height: 100%;
  }
  #measurement .waypoint-label {
    --transformX: -50%;
    --transformY: 0%;
    position: absolute;
    top: var(--position-y);
    left: var(--position-x);
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--control-bg-color);
    border-radius: 8px;
    transform-origin: top left;
    transform: scale(var(--ui-scale)) translate(var(--transformX), var(--transformY));
  }
  #measurement .waypoint-label .icon {
    color: var(--control-icon-color);
    font-size: var(--font-size-20);
  }
  #measurement .waypoint-label .img {
    width: 20px;
    height: 20px;
    opacity: 0.7;
    filter: var(--hud-icon-filter, none);
    background: transparent no-repeat center / contain;
  }
  #measurement .waypoint-label .total-measurement,
  #measurement .waypoint-label .total-elevation {
    color: var(--color-text-emphatic);
    font-size: var(--font-size-24);
  }
  #measurement .waypoint-label .delta-measurement,
  #measurement .waypoint-label .delta-elevation {
    color: var(--color-text-subtle);
    font-size: var(--font-size-16);
  }
  #measurement .waypoint-label.secret {
    background: var(--toggle-bg-color);
    border: 2px solid var(--toggle-active-border-color);
  }
  #measurement .distance-ruler-labels .waypoint-label {
    --transformY: -100%;
  }
  #sidebar {
    --sidebar-scroll-gutter: 12px;
    --sidebar-full-width: calc(var(--sidebar-width) + var(--sidebar-scroll-gutter));

    height: 100%;

    align-items: start;

  #sidebar .tabs li {

  }
  #sidebar-content {
    flex: none;
    width: var(--sidebar-full-width);
    height: 100%;
    align-items: flex-end;
    overflow: hidden;

    margin-right: calc(var(--sidebar-full-width) * -1);

  #sidebar-content .tab {
    flex: 1;
    width: var(--sidebar-width);

  #sidebar-content.expanded {
    margin-right: 0;
    margin-left: calc(var(--sidebar-scroll-gutter) * -1);

    flex: none;
    padding: 16px 16px 16px 0;
    border: none;
    line-height: 1;
  }
  #sidebar-tabs > menu {
    gap: 8px;
    pointer-events: all;
  }
  #sidebar-tabs > menu .ui-control[data-action="tab"] {
    cursor: var(--cursor-pointer);
  }
  .sidebar-tab {
    --sidebar-item-height: 48px;
    --sidebar-header-height: 32px;

    background: var(--sidebar-background, var(--color-cool-5-90));

  }
  .sidebar-tab button {

  }
  .sidebar-tab button.icon,
  .sidebar-tab button.inline-control {
    --button-size: 1.5rem;
  }

  .sidebar-popout {
    width: var(--sidebar-width);
  }

  /*  Directories                       */
  /* ---------------------------------- */

    /* Directory Lists */
    /* Directory Items */
    /* Directory Footer */

    padding: 0 0.25rem;

    gap: 8px;

  .directory .directory-header search input {

  .directory .directory-list {

    overflow: hidden auto;

  .directory .directory-item {

  .directory .directory-item img {

  .directory .directory-item .entry-name {

    position: relative;
    width: 20px;
    margin: 0 0 0 3px;
    text-align: center;
    text-shadow: inherit;
    padding: 0;
  }
  li.folder > .folder-header .create-button.create-folder {
    font-size: 120%;
  }
  li.folder > .folder-header .create-button.icon-plus::after {
    content: "\2b";
    position: absolute;
    top: -2px;
    right: -2px;
    font-size: 0.5rem;
    background: black;
    color: var(--color-light-1);
    padding: 1px;
    border-radius: 100%;
  }
  li.folder > .folder-header .create-button:hover {
    text-shadow: 0 0 6px var(--color-shadow-primary);
  }
  li.folder > .folder-header .create-button.icon-plus:hover::after {
    color: var(--color-text-accent);
  }
  li.folder.droptarget > .folder-header .folder-name {
    font-size: 120%;
  }
  li.folder.droptarget > .folder-header > i {
    text-shadow: 0 0 4px var(--color-shadow-primary);
    transform: scale(1.2);
    transform-origin: left;
    margin-right: 12px;
  }
  /* Collapsed */
  .directory li.folder:not(.expanded) .subdirectory {
    display: none;
  }
  .directory li.folder:not(.expanded) > .folder-header > i::before {
    content: "\f07b";
  }
  .directory li.folder:not(.expanded) > .folder-header .create-folder {
    display: none;
  }
  /* ---------------------------------- */
  /*  Scenes                            */
  /* ---------------------------------- */
  .scenes-sidebar {
    --sidebar-scene-height: 100px;
  }
  .scenes-sidebar .scene {
    color: var(--color-light-3);
    height: var(--sidebar-scene-height);
    border-top: var(--color-dark-1);
    background: var(--color-cool-5-90);
    gap: 0;
  }
  .scenes-sidebar .scene > img {
    width: 100%;
    height: 100%;
    flex: 0 0 100%;
    object-fit: cover;
    object-position: center;
  }
  .scenes-sidebar .scene .entry-name {
    position: absolute;
    inset: 0;
    padding: 0 0.25rem;
    place-content: center;
    text-align: center;
    font-size: 1.3em;
    font-weight: normal;
    text-shadow: 1px 1px 3px var(--color-shadow-dark);
    box-shadow: 0 0 20px var(--color-shadow-dark) inset;
    line-height: normal;
    overflow: hidden;
  }
  .scenes-sidebar .scene .entry-name:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  .scenes-sidebar .directory-item.entry:hover {
    background: var(--color-cool-5-90);
  }
  /* ---------------------------------- */
  /*  Compendium Packs                  */
  /* ---------------------------------- */
  .compendium-sidebar .compendium {
    height: 70px;
    position: relative;
    color: var(--color-light-2);
    border-top: 1px solid var(--color-dark-1);
  }
  .compendium-sidebar .compendium::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.2);
    pointer-events: none;
    transition: 500ms;
    z-index: 0;
  }
  .compendium-sidebar .compendium .compendium-banner {
    width: 100%;
    height: 100%;
    flex: 0 0 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0.8;
    transition: 500ms;
  }
  .compendium-sidebar .compendium .compendium-name {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: normal;
    gap: 6px;
    padding: 0 8px;
    z-index: 1;
  }
  .compendium-sidebar .compendium .compendium-name strong {
    font-size: 1.3em;
    font-weight: normal;
    text-shadow: 1px 1px 3px var(--color-shadow-dark);
    text-align: center;
  }
  .compendium-sidebar .compendium .compendium-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    font-size: var(--font-size-12);
    padding: 1px 8px 0 4px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 0 3px 0 0;
    pointer-events: none;
    z-index: 1;
  }
  .compendium-sidebar .compendium .status-icons {
    position: absolute;
    top: 0;
    right: 0;
    padding: 4px;
    gap: 4px;
    font-size: var(--font-size-12);
    line-height: 16px;
    text-align: right;
    text-shadow: 0 0 4px black;
  }
  .compendium-sidebar .compendium.locked {
    color: var(--color-light-3);
  }
  .compendium-sidebar .compendium.locked::after {
    background: rgba(0, 0, 0, 0.4);
  }
  .compendium-sidebar .compendium:hover {
    color: var(--color-light-1);
  }
  .compendium-sidebar .compendium:hover .compendium-name i {
    text-shadow: none;
  }
  .compendium-sidebar .compendium:hover::after {
    background: rgba(0, 0, 0, 0);
  }
  #context-menu li.context-item.document-type {
    display: flex;
    align-items: center;
  }
  #context-menu li.context-item.document-type.active::after {
    content: "\f00c";
    font-family: var(--font-awesome);
    font-weight: 900;
    margin-left: auto;
    font-size: var(--font-size-12);
  }
  /* ---------------------------------- */
  /*  Playlists                         */
  /* ---------------------------------- */
  .playlists-sidebar {
    --entry-height: 20px;
  }
  .playlists-sidebar .global-control,
  .playlists-sidebar .directory-list {
    font-size: var(--font-size-14);
  }
  .playlists-sidebar .global-control header,
  .playlists-sidebar .directory-list header {
    display: flex;
    gap: 5px;
    line-height: var(--entry-height);
    align-items: center;
  }
  .playlists-sidebar .global-control header strong,
  .playlists-sidebar .directory-list header strong,
  .playlists-sidebar .global-control header label,
  .playlists-sidebar .directory-list header label {
    flex: 1;
  }
  .playlists-sidebar .global-control button,
  .playlists-sidebar .directory-list button {
    --button-size: 1rem;
    --button-hover-background-color: transparent;
    --button-text-color: var(--color-text-primary);
    --button-hover-text-color: var(--color-text-accent);
    border: none;
    font-size: var(--font-size-11);
    transition: color 0.5s;
  }
  .playlists-sidebar .global-control button.fa-square,
  .playlists-sidebar .directory-list button.fa-square {
    --button-text-color: var(--color-text-accent);
  }
  .playlists-sidebar .global-control button.inactive,
  .playlists-sidebar .directory-list button.inactive,
  .playlists-sidebar .global-control button:disabled,
  .playlists-sidebar .directory-list button:disabled {
    --button-text-color: var(--color-text-subtle);
  }
  .playlists-sidebar .playlist.directory-item.document {
    display: flex;
    flex-direction: column;
    padding: 0 8px;
    gap: 0;
  }
  .playlists-sidebar .playlist.directory-item.document .playlist-sounds {
    padding-block: 4px;
  }
  .playlists-sidebar .expandable {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 250ms ease;
  }
  .playlists-sidebar .expandable .wrapper {
    overflow: hidden;
  }
  .playlists-sidebar .playlist header,
  .playlists-sidebar .global-volume header {
    cursor: var(--cursor-pointer);
  }
  .playlists-sidebar .playlist .expand,
  .playlists-sidebar .global-volume .expand {
    transition: all 250ms ease;
  }
  .playlists-sidebar .playlist.expanded .expand,
  .playlists-sidebar .global-volume.expanded .expand {
    transform: rotate(180deg);
  }
  .playlists-sidebar .playlist.expanded .expandable,
  .playlists-sidebar .global-volume.expanded .expandable {
    grid-template-rows: 1fr;
  }
  .playlists-sidebar .playlist-sounds,
  .playlists-sidebar .global-volume ol {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .playlists-sidebar .global-volume ol {
    padding: 8px;
  }
  .playlists-sidebar .sound {
    display: flex;
    flex-direction: column;
  }
  .playlists-sidebar .sound-controls {
    flex: 0 0 32px;
    justify-content: end;
  }
  .playlists-sidebar .sound-timer {
    font-size: var(--font-size-11);
    color: var(--color-text-secondary);
  }
  .playlists-sidebar .sound-playback,
  .playlists-sidebar .global-volume li {
    line-height: var(--entry-height);
    margin: 0;
    gap: 4px;
  }
  .playlists-sidebar .sound-playback strong,
  .playlists-sidebar .global-volume li strong,
  .playlists-sidebar .sound-playback .sound-timer,
  .playlists-sidebar .global-volume li .sound-timer {
    flex: 1;
  }
  .playlists-sidebar .sound-playback button,
  .playlists-sidebar .global-volume li button {
    flex-grow: 0;
    flex-shrink: 0;
  }
  .playlists-sidebar .sound-playback .volume-icon,
  .playlists-sidebar .global-volume li .volume-icon {
    flex: 0 0 1rem;
  }
  .playlists-sidebar .sound-playback .volume-icon.fa-volume-xmark,
  .playlists-sidebar .global-volume li .volume-icon.fa-volume-xmark {
    color: var(--color-text-subtle);
  }
  .playlists-sidebar .sound-playback range-picker,
  .playlists-sidebar .global-volume li range-picker {
    flex: 2;
  }
  .playlists-sidebar .sound-playback range-picker input[type=range],
  .playlists-sidebar .global-volume li range-picker input[type=range] {
    height: var(--entry-height);
  }
  .playlists-sidebar .sound-playback range-picker input[type=number],
  .playlists-sidebar .global-volume li range-picker input[type=number] {
    display: none;
  }
  .playlists-sidebar .playlist-header .playlist-name {
    line-height: var(--sidebar-header-height);
  }
  .playlists-sidebar .playlist-header .sound-controls {
    flex-basis: 64px;
  }
  .playlists-sidebar .global-control > header {
    padding: 8px;
    background: var(--color-dark-1);
    border-top: 1px solid var(--color-dark-1);
    border-bottom: 1px solid var(--color-dark-1);
    color: var(--color-light-2);
  }
  .playlists-sidebar .global-control .playlist-sounds {
    padding: 8px;
  }
  .playlists-sidebar .global-control .pin {
    font-size: var(--font-size-14);
  }
  /* ---------------------------------- */
  /*  Compendium                        */
  /* ---------------------------------- */
  .compendium-directory .window-header {
    background: none;
    border: none;
  }
  .compendium-directory:not(.minimized) .window-header .window-title {
    visibility: hidden;
  }
  .compendium-directory .window-content {
    overflow: visible;
  }
  .compendium-directory .window-content > .wrapper {
    flex: 1;
    position: relative;
  }
  .compendium-directory .compendium-header {
    margin-top: calc(var(--header-height) * -1);
  }
  .compendium-directory .header-banner {
    position: relative;
    height: 100px;
    color: var(--color-light-2);
  }
  .compendium-directory .header-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: none;
    mask-image: var(--header-mask, linear-gradient(black, transparent));
    border-bottom: var(--header-border, none);
    opacity: 0.8;
  }
  .compendium-directory .header-banner .compendium-name {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .compendium-directory .header-banner .compendium-name strong {
    width: 100%;
    padding: 16px;
    font-size: var(--font-size-20);
    font-family: var(--font-sans);
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.5) 25%, rgba(0, 0, 0, 0.5) 75%, transparent);
  }
  .compendium-directory .header-banner .compendium-name strong::after {
    content: "";
    display: block;
    width: 100%;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--color-light-4), transparent);
  }
  .compendium-directory .directory-list {
    position: absolute;
    inset: 0;
  }
  .compendium-directory .directory-list .directory-item.entry > i {
    flex: none;
    margin-left: 8px;
  }
  /* ---------------------------------- */
  /*  Chat                              */
  /* ---------------------------------- */
  #sidebar-content #chat {
    padding: 4px 0;
    overflow: hidden;
    align-items: flex-end;
    width: 100%;
    gap: 8px;
  }
  #sidebar-content #chat .chat-scroll {
    direction: rtl;
  }
  #sidebar-content #chat .chat-log {
    direction: ltr;
    max-width: var(--sidebar-width);
  }
  #sidebar-content.active-chat {
    pointer-events: none;
  }
  /* ---------------------------------- */
  .chat-sidebar {
    --chat-message-spacing: 4px;
  }
  .chat-sidebar:not(.sidebar-popout, .with-background) {
    background: transparent;
  }
  .chat-sidebar .chat-scroll {
    flex: 1;
    width: 100%;
    overflow: hidden auto;
    position: relative;
  }
  .chat-sidebar .chat-scroll.scrolled {
    mask-image: linear-gradient(to bottom, black 95%, transparent);
  }
  .chat-sidebar .chat-scroll.overflowed {
    pointer-events: all;
  }
  .chat-sidebar .chat-log {
    width: 100%;
  }
  .chat-sidebar .chat-form {
    position: relative;
    flex: none;
    width: var(--sidebar-width);
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-inline: var(--chat-message-spacing);
    pointer-events: all;
  }
  .chat-sidebar .jump-to-bottom {
    position: absolute;
    bottom: calc(100% + var(--chat-message-spacing));
  }
  .chat-sidebar #chat-controls {
    flex: none;
    display: flex;
    justify-content: space-between;
  }
  .chat-sidebar #chat-controls .control-buttons {
    display: flex;
    gap: 4px;
  }
  .chat-sidebar .chat-input {
    flex: 0 0 calc(var(--chat-input-height) + 50px);
  }
  .chat-sidebar .chat-input menu {
    --menu-padding: 8px 0;
  }
  #chat-message {
    --min-height: unset;
    --input-text-color: var(--text-color, var(--color-light-2));
    overflow: hidden;
  }
  #chat-message code-mirror {
    min-height: unset;
  }
  #chat-message > .editor-container {
    margin: 0;
    padding: 0;
    background: var(--background-color, var(--color-cool-5));
    border: 2px solid var(--border-color, var(--color-cool-4));
    font-family: var(--font-body);
    transition: box-shadow 250ms, outline 250ms;
  }
  #chat-message > .editor-container .editor-content {
    color: var(--color-text-primary);
    padding-left: 4px;
  }
  #chat-message > .editor-container:not(:focus-within):has(.editor-content > p:only-child > br:only-child)::after {
    content: var(--chat-message-placeholder, "");
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: grid;
    place-content: center;
    font-size: var(--font-size-16);
    font-style: italic;
    color: var(--placeholder-color);
  }
  /* Popout-specific Styles */
  #chat-popout .window-content {
    padding: 0;
  }
  #chat-popout .chat-form {
    padding-inline: 0;
  }
  #chat-popout #chat-controls {
    padding-inline: var(--chat-message-spacing);
  }
  /* Chat Notifications */
  #chat-notifications {
    --chat-message-spacing: 4px;
    display: grid;
    grid-template-rows: 1fr calc(var(--chat-input-height) + var(--chat-menu-height, 0px) + 10px);
    align-items: end;
    position: relative;
    height: 0;
    width: var(--sidebar-width);
    flex: 1;
    order: 99;
  }
  #chat-notifications:focus-within {
    --ui-fade-opacity: 1;
  }
  #chat-notifications:has(.chat-input:focus-within) {
    --chat-menu-height: 50px;
  }
  #chat-notifications.active {
    --ui-fade-delay: 0;
    --ui-fade-duration: 100ms;
    opacity: 1;
  }
  #chat-notifications .chat-input {
    pointer-events: all;
  }
  #chat-notifications .chat-input > .editor-container {
    margin: 0;
    min-height: 60px;
    transition: all var(--ui-fade-duration);
  }
  #chat-notifications .chat-input > .editor-container:focus-within {
    min-height: var(--chat-input-height);
  }
  #chat-notifications #chat-controls {
    position: absolute;
    inset: auto auto 0 calc(100% + 16px);
  }
  #chat-notifications .overflow {
    height: 100%;
    display: flex;
    flex-direction: column-reverse;
    overflow: hidden auto;
  }
  #chat-notifications .chat-log {
    height: unset;
    flex: none;
  }
  #chat-notifications .chat-log .spacer,
  #chat-notifications .chat-log .deleting {
    flex: none;
  }
  /* ---------------------------------- */
  /*  Single Chat Message               */
  /* ---------------------------------- */
  .chat-message {
    margin: var(--chat-message-spacing);
    padding: 8px;
    font-size: var(--font-size-14);
    color: var(--color-dark-1);
    background: var(--chat-message-background);
    border: 2px solid var(--chat-message-border-color);
    border-radius: 6px;
    pointer-events: all;
  }
  .chat-message h4 {
    font-family: var(--font-sans);
    line-height: unset;
    color: inherit;
  }
  .chat-message button {
    height: var(--input-height);
  }
  .chat-message.deleting {
    padding: 0;
    overflow: hidden;
  }
  .chat-message .message-header {
    align-items: start;
    line-height: 20px;
    color: var(--color-dark-4);
  }
  .chat-message .message-header h4 {
    font-size: inherit;
    font-weight: inherit;
  }
  .chat-message .message-header .message-sender {
    flex: 3;
    margin: 0;
    white-space: nowrap;
  }
  .chat-message .message-header .message-metadata {
    flex: 2;
    text-align: right;
    font-size: var(--font-size-12);
    display: flex;
    justify-content: end;
    gap: 4px;
  }
  .chat-message .message-header .message-metadata .message-dismiss {
    margin-inline: 4px;
    font-size: var(--font-size-14);
  }
  .chat-message .message-header .flavor-text,
  .chat-message .message-header .whisper-to {
    flex: 0 0 100%;
    font-size: var(--font-size-12);
  }
  .chat-message .message-content {
    overflow: hidden;
    padding: 2px 0;
    user-select: text;
    word-break: break-word;
  }
  .chat-message.emote {
    background: var(--color-emote-background);
    border: 2px solid var(--color-emote-border);
  }
  .chat-message.whisper {
    background: var(--color-whisper-background);
    border: 2px solid var(--color-whisper-border);
  }
  .chat-message.blind {
    background: var(--color-blind-background);
    border: 2px solid var(--color-blind-border);
  }
  .chat-message .cards-notification {
    align-items: center;
  }
  .chat-message .cards-notification > .icon {
    flex: 0 0 32px;
    height: 32px;
    margin-right: 8px;
  }
  .chat-message .cards-notification > p {
    margin: 0;
  }
  /* Roll Table Results */
  .chat-message .table-draw .table-description {
    border-top: 1px solid #b5b3a4;
    color: var(--color-dark-4);
    font-size: var(--font-size-12);
    padding: 5px 0;
  }
  .chat-message .table-draw ul.table-results {
    list-style: none;
    margin: 5px 0 0;
    padding: 0;
  }
  .chat-message .table-draw ul.table-results li {
    justify-content: start;
    border-bottom: 1px solid #b5b3a4;
    padding: 0.25rem 0;
  }
  .chat-message .table-draw ul.table-results li:last-of-type {
    padding-bottom: 0;
  }
  .chat-message .table-draw ul.table-results li > img {
    flex: 0 0 32px;
    width: 32px;
    margin-right: 4px;
    object-fit: cover;
  }
  .chat-message .table-draw ul.table-results li > a.content-link {
    flex: 0;
  }
  .chat-message .table-draw ul.table-results li > .description {
    flex-basis: 100%;
    padding-top: 0.25rem 0;
  }
  .chat-message .table-draw ul.table-results li > .description > p:first-of-type {
    margin-top: 0.125rem;
  }
  .chat-message .table-draw ul.table-results li > .description > p:last-of-type {
    margin-bottom: 0;
  }
  .chat-message .table-draw ul.table-results li:last-child {
    border-bottom: none;
  }
  /* ---------------------------------- */
  /*  Combat Tracker                    */
  /* ---------------------------------- */
  .combat-sidebar {
    --element-spacing: 8px;
    --element-spacing-half: 4px;
  }
  .combat-sidebar.active {
    display: flex;
    height: 0;
  }
  .combat-sidebar .window-content {
    padding: 0;
  }
  .combat-sidebar:not(.sidebar-popout),
  .combat-sidebar.sidebar-popout .window-content {
    flex-direction: column;
    gap: var(--element-spacing);
  }
  .combat-sidebar .combat-tracker-header,
  .combat-sidebar .combat-controls {
    flex: none;
    display: flex;
    padding: var(--element-spacing);
    gap: var(--element-spacing);
  }
  .combat-sidebar .combat-tracker-header {
    flex-direction: column;
    padding-bottom: 0;
  }
  .combat-sidebar .combat-tracker-header .encounters,
  .combat-sidebar .combat-tracker-header .encounter-controls {
    display: flex;
    align-items: center;
    gap: var(--element-spacing-half);
  }
  .combat-sidebar .combat-tracker-header .encounters.tabbed [data-action=trackerSettings] {
    margin-left: auto;
  }
  .combat-sidebar .combat-tracker-header .encounters.cycle {
    justify-content: space-between;
  }
  .combat-sidebar .combat-tracker-header .encounters .cycle-combats {
    flex: 1;
    display: flex;
    gap: var(--element-spacing);
    align-items: center;
    justify-content: center;
  }
  .combat-sidebar .combat-tracker-header .encounters .cycle-combats .encounter-count {
    color: var(--color-text-secondary);
  }
  .combat-sidebar .combat-tracker-header .encounter-name {
    margin: 0;
    overflow: hidden;
    font-size: var(--font-size-16);
    font-family: var(--font-sans);
    color: var(--color-text-primary);
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .combat-sidebar .combat-tracker-header .encounter-controls .inline-control:disabled {
    visibility: hidden;
  }
  .combat-sidebar .combat-tracker-header .encounter-controls .control-buttons {
    gap: var(--element-spacing-half);
  }
  .combat-sidebar .combat-tracker-header .encounter-controls .spacer {
    flex: 0 0 24px;
    width: 24px;
  }
  .combat-sidebar .combat-tracker-header .encounter-controls .encounter-title {
    flex: 1;
    text-align: center;
    color: var(--color-text-secondary);
    font-size: var(--font-size-15);

  #camera-views.top {
    border-bottom: 1px solid var(--av-border-color, var(--color-cool-4));
  }
  #camera-views.bottom {
    border-top: 1px solid var(--av-border-color, var(--color-cool-4));

  .camera-view {
    position: relative;
    border: none;
    border-radius: 5px;
    box-shadow: 0 4px 10px black;
    overflow: hidden;
    flex: none;
    /* Popout */
  }
  .camera-view::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
  }
  .camera-view:hover :is(.control-bar, .bottom .user-controls) {
    display: flex;
  }
  .camera-view.speaking::after {
    border: 3px solid var(--av-border-color-speaking, #3ba55d);
  }
  .camera-view .control-bar,
  .camera-view .notification-bar {
    position: absolute;
    top: 0;
  }
  .camera-view .bottom {
    position: absolute;
    inset: auto 0 0 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.65) 75%, transparent);
    display: flex;
    flex-direction: column;
  }
  .camera-view .bottom .user-controls {
    display: none;
    justify-content: space-evenly;
    position: relative;
    top: 12px;
  }
  .camera-view .player-name {
    padding: 12px 8px 8px 20px;
    text-align: center;
    min-height: 40px;
  }
  .camera-view .player-name::before {
    content: "";
    width: 12px;
    height: 12px;
    display: block;
    background: var(--player-color);
    border: 1px solid var(--player-border);
    border-radius: 100%;
    position: absolute;
    inset: auto auto 10px 8px;
  }
  .camera-view .player-name strong {
    line-height: 36px;
    position: absolute;
    inset: auto 0 0 0;
  }
  .camera-view .player-name:not(.noanimate) strong:first-child {
    opacity: 1;
    animation: 16s infinite fadeoutin;
  }
  .camera-view .player-name:not(.noanimate) strong:last-child {
    opacity: 0;
    animation: 16s infinite fadeinout;
  }
  @keyframes fadeoutin {
    from {
      opacity: 1;
    }
    30% {
      opacity: 1;
    }
    50% {
      opacity: 0;
    }
    80% {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes fadeinout {
    from {
      opacity: 0;
    }
    30% {
      opacity: 0;
    }
    50% {
      opacity: 1;
    }
    80% {
      opacity: 1;
    }
    to {
      opacity: 0;
    }
  }
  .camera-view .video-container {
    position: relative;
  }
  .camera-view .video-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.25);
  }
  .camera-view .video-container .user-avatar {
    aspect-ratio: 4 / 3;
    width: 100%;
    object-fit: cover;
  }
  .camera-view .video-container .user-camera {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .camera-view .notification-bar {
    right: 0;
    color: #ba2200;
    gap: 8px;
    padding: 8px;
    font-size: 20px;
    filter: drop-shadow(0 0 6px black);
  }
  .camera-view .control-bar {
    left: 0;
    gap: 8px;
    padding: 8px;
    display: none;
  }
  .camera-view .control-bar > button {
    --control-size: 24px;
    font-size: var(--font-size-14);
  }
  .camera-view .volume-bar {

  }

    font-size: var(--font-size-12);
  }
  .camera-view .volume-bar range-picker {
    flex: 1;
  }
  .camera-view .volume-bar input[type=number] {
    display: none;
  }
  .camera-view.popout {
    position: fixed;
    min-width: 240px;
  }

  #setup-warnings .package header .reference {

  #setup-warnings .package code {

  #setup-warnings .package code.warnings {

  #setup-warnings .package code.errors {
    border-color: var(--color-level-error);

  #setup-warnings .package .control {

  /*  Server Settings Configuration           */
  /* ---------------------------------------- */
  #server-settings-config .form-group.warning {
    --color-form-label: var(--color-text-primary);
    --input-background-color: var(--color-cool-5-90);
    --color-form-hint: var(--color-text-secondary);

  #server-settings-config .form-group.upnp .form-fields label {
    white-space: nowrap;
  }
  #server-settings-config .form-group.ssl-cert {
    align-items: start;
  }
  #server-settings-config .form-group.ssl-cert .form-fields {
    flex: 2;
  }
  #server-settings-config .form-group.ssl-cert .form-fields label {
    flex-basis: 100%;
    gap: 0.5rem;
  }
  #server-settings-config .ssl-button {
    align-self: center;
    margin-right: 1rem;
  }
  /* ---------------------------------------- */
  /*  Miscellaneous                           */
  /* ---------------------------------------- */
  #confirm-code {
    margin: 1rem 0;
  }
  #confirm-code span {
    display: block;
    font-size: var(--font-size-24);
    text-align: center;
  }
  #delete-confirm {
    text-align: center;
  }
  .updated-packages form {
    height: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .updated-packages form .dialog-content {
    height: inherit;
    flex: inherit;
  }
  .updated-packages .header {
    font-size: var(--font-size-15);
    font-weight: bold;
    gap: 1rem;
    padding-bottom: 0.25rem;
    border-bottom: 1px solid var(--color-cool-4);
  }
  .updated-packages ul {
    padding-left: 0;
    margin: 0 calc(-1 * var(--scroll-margin)) 0 0;
  }
  .updated-packages ul li {
    gap: 1rem;
    padding: 1rem 0;
    margin-bottom: 0;
  }
  .updated-packages .package {
    flex: 0 0 240px;
  }
  .updated-packages .action {
    flex: 0 0 110px;
    font-weight: bold;
  }
  .updated-packages .description {
    overflow-wrap: anywhere;
  }
  .updated-packages .info {
    color: var(--color-level-info);
  }
  .updated-packages .info > i::before {
    content: "\f05a";
  }
  .updated-packages .warning {
    color: var(--color-level-warning);
  }
  .updated-packages .warning > i::before {
    content: "\f071";
  }
  .updated-packages .error {
    color: var(--color-level-error);
  }
  .updated-packages .error > i::before {
    content: "\f06a";
  }
  .updated-packages .success {
    color: var(--color-level-success);
  }
  .updated-packages .success > i::before {
    content: "\f00c";
  }
  .dependencies-info {
    align-items: unset;
  }
  .dependencies-info > .automatic {
    border-right: 2px var(--color-cool-4) solid;
    padding-right: 0.5rem;
  }
  .dependencies-info > .manual {
    padding-left: 0.5rem;
  }
  .dependencies-info .hint {
    line-height: 1rem;
    color: var(--color-light-5);
  }
  /* ---------------------------------------- */
  /*  Backups                                 */
  /* ---------------------------------------- */
  #backup-manager .window-header button.supplemental,
  .backup-list .window-header button.supplemental {
    font-size: inherit;
    padding: 0 0.5rem;
    white-space: nowrap;
  }
  #backup-manager .form-group,
  .backup-list .form-group {
    border-bottom: 1px solid var(--color-border);
    padding-bottom: 0.5rem;
  }
  #backup-manager .form-group label.checkbox,
  .backup-list .form-group label.checkbox {
    line-height: normal;
  }
  #backup-manager .form-group button,
  .backup-list .form-group button {
    --input-height: 1.5rem;
    font-size: var(--font-size-12);
  }
  #backup-manager aside > footer {
    justify-content: space-between;
  }
  #backup-manager aside > footer .size {
    color: var(--color-text-secondary);
  }
  #create-backup {
    font-size: var(--font-size-14);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
  #create-backup > input {
    top: -8px;
  }
  .snapshot-dialog .disk-space {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
  /* ---------------------------------------- */
  /*  Compatibility Checker                   */
  /* ---------------------------------------- */
  #compatibility-checker aside ul.summary {
    flex: none;
    list-style: none;
    padding-left: 0;
    font-size: var(--font-size-14);
  }
  #compatibility-checker aside ul.summary > li.understated {
    opacity: 0.75;
  }
  #compatibility-checker aside ul.summary > li > i {
    margin-right: 0.375rem;
  }
  #compatibility-checker aside ul.summary > li.success > i {
    color: var(--color-level-success);
  }
  #compatibility-checker aside ul.summary > li.warning > i {
    color: var(--color-level-warning);
  }
  #compatibility-checker aside ul.summary > li.error > i {
    color: var(--color-level-error);
  }
  #compatibility-checker aside ul.summary > li.neutral > i {
    color: var(--color-cool-3);
  }
  #compatibility-checker nav.filters span.label {
    color: var(--color-text-secondary);
  }
  #compatibility-checker nav.filters button {
    --control-border-color: var(--color-light-5);
    --control-hover-border-color: var(--control-border-color);
    --control-icon-color: var(--color-text-secondary);
    --control-size: 2em;
    flex: 1;
    font-size: var(--font-size-14);
  }
  #compatibility-checker nav.filters button:hover,
  #compatibility-checker nav.filters button[aria-pressed=true] {
    text-shadow: 0 0 10px var(--color-shadow-primary);
  }
  #compatibility-checker nav.filters button[aria-pressed=true] {
    cursor: var(--cursor-pointer);
  }
  #compatibility-checker .form-group {
    border-bottom: 1px solid var(--sidebar-separator);
    padding-bottom: 0.5rem;
  }
  #compatibility-checker .form-group label.checkbox {
    line-height: normal;
  }
  #compatibility-checker .form-group .form-fields {
    gap: 0.25rem;
  }
  #compatibility-checker .form-group .form-fields > :where(a, button) {
    --button-size: 2em;
    font-size: var(--font-size-12);
  }
  #compatibility-checker .form-group p.hint {
    font-size: var(--font-size-12);
    width: 0;
  }
  #compatibility-checker .form-group .tags > a {
    width: 0;
  }
  /* ---------------------------------------- */
  /*  Install Package                         */
  /* ---------------------------------------- */
  #install-package .window-content {
    display: grid;
    grid-template: "sidebar main" minmax(0, 1fr) "footer footer" auto / 300px minmax(0, 1fr);
    padding-inline-start: 0;
  }
  #install-package .window-content > aside {
    grid-area: sidebar;
    margin-right: 0;
    padding-inline-end: 0;
  }
  #install-package .window-content > aside nav.tabs {
    margin-inline-end: 0.5rem;
    padding: 1rem var(--scroll-margin) 1rem 1.25rem;
  }
  #install-package .window-content > .main {
    grid-area: main;
    padding-left: 1rem;
  }
  #install-package .window-content > footer {
    border-top: var(--sidebar-separator);
    flex-wrap: nowrap;
    grid-area: footer;
    margin-top: auto;
    padding: 1rem 0 0 1rem;
  }
  #install-package .window-content > footer label {
    color: var(--color-text-secondary);
    white-space: nowrap;
  }
  #install-package .window-content > footer button {
    --button-size: 2em;
  }
  #install-package .window-content search {
    padding: 0 16px 8px;
  }
  #install-package .window-content .package-filters {
    display: flex;
    flex: none;
    flex-direction: column;
    gap: 0.25rem;
    padding-inline: 16px;
  }
  #install-package .window-content .package-filters .form-group {
    gap: 0;
    margin: 0;
    padding: 0;
  }
  #install-package .window-content .package-filters .form-group label {
    font-size: var(--font-size-13);
  }
  #install-package .window-content .package-filters .input-element-tags {
    max-block-size: 8rem;
    overflow-y: auto;
  }
  #install-package nav.filters {
    gap: 1rem;
  }
  #install-package nav.filters .controls {
    justify-content: end;
  }
  #install-package nav.filters .controls button {
    --control-icon-color: var(--color-text-secondary);
    flex: 0 0 fit-content;
    font-size: var(--font-size-14);
    white-space: nowrap;
  }
  #install-package .form-group {
    padding-bottom: 0.5rem;
  }
  #install-package .form-group .form-fields span.protected {
    color: var(--color-text-secondary);
    flex: 0;
    font-size: var(--font-size-12);
    position: relative;
    top: 1px;
  }
  #install-package .form-group .form-fields button.install-package {
    color: var(--color-text-secondary);
  }
  #install-package .categories .tags a {
    width: 0;
  }
  #setup-install-dependencies .scrollable {
    max-height: 600px;
  }
  /* ---------------------------------------- */
  /*  Create World    View                    */
  /* ---------------------------------------- */
  #world-create {
    display: flex;
    gap: 1rem;
    flex-wrap: nowrap;
  }
  #world-create .menu {
    position: fixed;
    inset: 40px 40px auto auto;
  }
  #world-create .menu button {
    --button-size: 40px;
    font-size: var(--font-size-20);
  }
  #world-create .config {
    width: 600px;
    height: 800px;
    padding: var(--form-padding) 0 0;
  }
  #world-create .config .form-group {
    padding-inline: var(--form-padding);
  }
  #world-create .config .description {
    flex: 1;
    flex-direction: column;
    padding: 0;
    align-items: start;
  }
  #world-create .config .description > * {
    flex: unset;
  }
  #world-create .config .description label {
    padding-inline: var(--form-padding);
  }
  #world-create .config .description .form-fields {
    flex: 1;
    flex-direction: column;
    align-items: unset;
  }
  #world-create .config prose-mirror menu {
    border-radius: 0;
  }
  #world-create .config prose-mirror .editor-content {
    margin-inline: 0.5rem;
  }
  #world-create .center {
    gap: 1rem;
  }
  #world-create .systems,
  #world-create .modules {
    flex: 0 0 350px;
  }
  #world-create .systems .wrapper,
  #world-create .modules .wrapper {
    flex: 1;
    position: relative;
  }
  #world-create .systems .gallery,
  #world-create .modules .gallery {
    position: absolute;
    inset: 0;
    gap: 1rem;
  }
  #world-create .systems .gallery .package,
  #world-create .modules .gallery .package {
    height: 175px;
    cursor: var(--cursor-pointer);
  }
  #world-create .systems .gallery .package.nomatch,
  #world-create .modules .gallery .package.nomatch {
    display: none;
  }
  #world-create .modules {
    visibility: hidden;
  }
  #world-create .modules.visible {
    visibility: visible;
  }
  #world-create .package.active {
    box-shadow: 0 0 4px var(--color-warm-2), inset 0 0 10px var(--color-warm-2);
  }
  #world-create button.bright {
    --button-size: 40px;
    width: 100%;
    box-shadow: 0 0 10px var(--color-warm-1);
  }
  #world-create .system-field,
  #world-create .adventure-field {
    display: none;
  }
  #world-create search {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    transition: outline-color 500ms ease;
    padding-left: 8px;
    border-radius: 4px;
    outline-color: transparent;
  }
  #world-create search:focus-within {
    outline: 2px solid var(--input-focus-outline-color);
    outline-offset: -2px;
  }
  #world-create search i {
    color: var(--input-placeholder-color);
  }
  #world-create search input {
    --input-background-color: transparent;
    --input-focus-outline-color: transparent;
    font-size: var(--font-size-16);
  }
  @media (max-height: 1110px) {
    #world-create {
      flex: 1;
    }
    #world-create .config {
      height: unset;
      flex: 1;
    }
  }
  @media (max-width: 1336px) {
    #world-create .framed.systems,
    #world-create .framed.modules {
      display: none;
    }
    #world-create .system-field,
    #world-create .adventure-field {
      display: flex;
    }
  }
  /* ---------------------------------------- */
  /*  Software Update View                    */
  /* ---------------------------------------- */
  body.update {
    --max-width: 960px;
  }
  body.update #update-progress {
    --color-progress-background: #5D49FF;
    --color-progress-border: #B2C3FF;
    display: none;
    flex: 0 0 16px;
    width: 100%;
    background: black;
    border: 1px solid var(--color-cool-3);
    border-radius: 4px;
  }
  body.update #update-progress .bar {
    position: relative;
    height: 10px;
    margin: 2px;
    display: block;
    background: var(--color-progress-background);
    border: 1px solid var(--color-progress-border);
    border-radius: 2px;
    max-width: calc(100% - 4px);
    transition: 0.25s;
    line-height: 10px;
    text-align: right;
  }
  body.update #update-progress .pct {
    display: block;
    position: absolute;
    top: -3px;
    right: -3px;
    padding: 1px 5px;
    color: var(--color-light-1);
    text-shadow: 1px 1px 4px black;
    background: var(--color-cool-5-75);
    border: 1px solid black;
    border-radius: 2px;
  }
  /* ---------------------------------------- */
  /*  Update Software                         */
  /* ---------------------------------------- */
  #setup-update .update-channels {
    gap: 8px;
  }
  /* ---------------------------------------- */
  /*  Update Notes                            */
  /* ---------------------------------------- */
  #update-notes {
    max-height: 80vh;
  }
  #update-notes article h1 {
    font-size: var(--font-size-32);
  }
  #update-notes article h2 {
    font-size: var(--font-size-24);
  }
  #update-notes article h3 {
    font-size: var(--font-size-20);
  }
  #update-notes article h4 {
    font-size: var(--font-size-18);
  }
  #update-notes article h5 {
    font-size: var(--font-size-16);
  }
  #module-config .tab {
    min-height: 50px;
  }
  #module-config .tab button.icon {
    --button-size: 1.75rem;
  }
  /* ---------------------------------------- */
  /*  Join Game View                          */
  /* ---------------------------------------- */
  body.join {
    --max-width: 1040px;
  }
  body.join #main-background {
    background-position: center;
  }
  body.join #join-game {
    width: 100%;
    max-width: var(--max-width);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: min-content min-content 1fr;
    gap: 1rem;
  }
  body.join #join-game-details .form-group > label {
    flex: 2;
  }
  body.join #join-game-details .form-fields > span {
    flex: none;
  }
  body.join #join-game-world {
    grid-row: 1 / span 3;
    grid-column: 2;
  }
  body.join #world-description {
    max-height: 500px;
  }
  body.join #autocomplete {
    max-width: 300px;
  }
  body.join.join-theme-minimal {
    --max-width: 460px;
  }
  body.join.join-theme-minimal #main-header {
    background: none;
    flex: 1;
  }
  body.join.join-theme-minimal #join-game {
    flex: 2;
    display: flex;
    flex-direction: column;
  }
  body.join.join-theme-minimal #join-game h2 {
    display: none;
  }
  body.join.join-theme-minimal #join-game #join-game-setup p {
    display: none;
  }
  body.join.join-theme-minimal #watermark {
    display: none;
  }
  /* ---------------------------------------- */
  /*  User Management View                    */
  /* ---------------------------------------- */
  body.players {
    --max-width: 720px;
    /* ----------------------------------------- */
    /*  Permissions Config                       */
    /* ----------------------------------------- */
  }
  body.players #manage-players {
    width: 100%;
    max-width: var(--max-width);
  }
  body.players #manage-players header.player {
    margin-bottom: -0.5rem;
  }
  body.players #manage-players header.player.offset {
    margin-left: 3rem;
  }
  body.players #manage-players #player-list {
    display: flex;
    max-height: calc(100vh - 450px);
    overflow-y: auto;
    flex-direction: column;
    gap: 0.5rem;
    margin: -0.75rem;
    padding: 0.75rem;
  }
  body.players #manage-players #player-list li {
    margin: 0;
  }
  body.players #manage-players .show {
    flex: 0 0 32px;
    text-align: center;
  }
  body.players #manage-players .show > i {
    margin: 0;
  }
  body.players #manage-players .controls {
    flex: 0 0 48px;
    justify-content: flex-end;
    text-align: center;
  }
  body.players #permissions-config header.table-header {
    background: var(--color-cool-4);
    padding: 0.5rem;
    color: var(--color-text-light-highlight);
    border: 1px solid var(--color-cool-4);
    text-align: center;
    font-weight: bold;
  }
  body.players #permissions-config ul.permissions-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 600px;
    overflow: hidden auto;
  }
  body.players #permissions-config li.permission {
    padding: 0.25rem 0.5rem;
    border-bottom: 1px solid var(--color-border-dark-4);
  }
  body.players #permissions-config li.permission .form-fields {
    justify-content: space-around;
  }
  body.players #permissions-config .index {
    flex: 0 0 200px;
    font-weight: bold;
    text-align: left;
  }
  body.players #permissions-config button {
    --button-size: calc(1.25 * var(--input-height));
  }
  /* ----------------------------------------- */
  /*  Game Layout                              */
  /* ----------------------------------------- */
  body.game {
    position: fixed;
    display: flex;
    padding: 0;
    overflow: hidden;
    cursor: var(--cursor-default);
  }
  #interface {
    display: flex;
    flex: 1;
    justify-content: center;
    overflow: visible;
    position: relative;
  }
  #ui-middle {
    flex: none;
    width: 60%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: var(--z-index-app);
    transform: scale(var(--ui-scale));
    transform-origin: top center;
    height: calc(100% / var(--ui-scale));
  }
  #ui-middle #ui-top {
    width: 100%;
    height: 50%;
    justify-content: flex-start;
    align-items: center;
  }
  #ui-middle #ui-bottom {
    width: 100%;
    height: 50%;
    justify-content: flex-end;
    align-items: center;
  }
  #ui-middle #ui-bottom > #camera-views {
    justify-content: flex-start;
  }
  #ui-left {
    --control-columns: 2;
    --control-size: 32px;
    position: absolute;
    left: 0;
    width: 50%;
    align-items: flex-start;
    flex-wrap: nowrap;
    padding: 16px;
    gap: 16px;
    pointer-events: none;
    z-index: var(--z-index-app);
    transform: scale(var(--ui-scale));
    transform-origin: top left;
    height: calc(100% / var(--ui-scale));
  }
  #ui-left #ui-left-column-1 {
    flex: none;
    width: calc((var(--control-columns) * var(--control-size)) + ((var(--control-columns) - 1) * 8px));
    height: 100%;
    justify-content: space-between;
    gap: 16px;
  }
  #ui-left #ui-left-column-2 {
    flex: 0 0 200px;
    height: 100%;
  }
  #ui-right {
    position: absolute;
    inset: 0 0 0 auto;
    align-items: flex-start;
    gap: 16px;
    pointer-events: none;
    z-index: var(--z-index-app);
    transform: scale(var(--ui-scale));
    transform-origin: top right;
    height: calc(100% / var(--ui-scale));
  }
  #ui-right #ui-right-column-1 {
    flex: 1;
    height: 100%;
    padding: 16px 0 14px;
    gap: 16px;
  }
  canvas#board {
    z-index: var(--z-index-canvas);
    width: 100%;
    height: 100%;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  /* ----------------------------------------- */
  /*  Detached Windows                         */
  /* ----------------------------------------- */
  body.detached {
    background: #2e2c29;
  }
  body.stream {
    background: lime;
    box-shadow: none;
    /* Stream Chat */
  }
  body.stream .tab[data-tab] {
    position: absolute;
    top: 20px;
    display: block;
    width: 300px;
    height: calc(100vh - 40px);
  }
  body.stream #chat {
    left: 20px;
    display: flex;
    overflow: hidden;
  }
  body.stream #chat .chat-form {
    display: none;
  }
}
@layer layouts.responsive {
  @media (max-width: 1440px) {
    body.setup {
      height: unset;
    }
    body.auth {
      min-height: 100vh;
    }
    #setup {
      display: unset;
      overflow: unset;
      margin: 2rem 0;
    }
    #setup-packages {
      max-width: unset;
    }
    #setup-sidebar {
      width: 100%;
      flex-direction: row;
      justify-content: center;
      margin: 1rem auto 0;
      container: unset;
    }
    #setup-sidebar #setup-sidebar-news,
    #setup-sidebar #setup-sidebar-featured {
      flex: 0 0 400px;
    }
    #setup-sidebar #news-articles {
      position: unset;
    }
    #setup-sidebar #news-articles .news {
      flex: 0 0 100px;
    }
  }
  @media (max-width: 960px) {
    #setup-packages .tabs h2.divider::before,
    #setup-packages .tabs h2.divider::after {
      content: unset;
    }
    #setup-sidebar {
      flex-direction: column;
    }

  @media (max-height: 960px) {
    #main-header {
      --header-size: 80px;
    }
  }
  @media (max-width: 720px) {
    #setup-packages .tabs .tab-icon + .tab-title {
      display: none;
    }
  }
  @media (max-width: 480px) {
    :root {
      --font-size-10: 0.5rem;
      --font-size-11: 0.625rem;
      --font-size-12: 0.625rem;
      --font-size-13: 0.75rem;
      --font-size-14: 0.75rem;
      --font-size-15: 0.875rem;
      --font-size-16: 0.875rem;
      --font-size-18: 1rem;
      --font-size-20: 1.125rem;
      --font-size-24: 1.25rem;
      --font-size-28: 1.5rem;
      --font-size-32: 1.75rem;
      --font-size-36: 2rem;
      --font-size-48: 2.25rem;
      --font-size-64: 2.5rem;
      --font-size-80: 3rem;
    }
    /* ---------------------------------------- */
    /*  views/auth.less                         */
    /* ---------------------------------------- */
    body.auth {
      --header-size: 100px;
      --form-padding: 1rem;
    }
  }
}
/* ---------------------------------------- */
/*  Special Exceptions                      */
/* ---------------------------------------- */
@layer exceptions {
  /* ---------------------------------- */
  /*  Applications                      */
  /* ---------------------------------- */
  body.game:is(.performance-low, .noblur) :is(#menu, .app, .application) {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  body.game:is(.performance-low, .noblur) :is(#menu, .app, .application) .window-content {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  /* ---------------------------------- */
  /*  Chat                              */
  /* ---------------------------------- */
  #chat-notifications .overflow {
    scrollbar-width: none;
  }
}

/* Rule Them'All — tokens.css : Échelle partagée : espacements, rayons, typographie.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* ================================================================
   RTA DESIGN SYSTEM — single shared scale
   These are the only generic spacing and typography primitives.
   Component-specific geometry (grids, icon sizes, min-width) is
   intentionally kept out of the scale and documented separately.
   ================================================================ */
:is(.rta-configurator, .rta-config-entry, .rta-sheet, .rta-chat-card, .rta-creation) {
  --rta-space-1: .125rem;
  /* 2px at a 16px root */
  --rta-space-2: .25rem;
  /* 4px */
  --rta-space-3: .375rem;
  /* 6px */
  --rta-space-4: .5rem;
  /* 8px */
  --rta-space-5: .625rem;
  /* 10px */
  --rta-space-6: .75rem;
  /* 12px */
  --rta-space-7: .875rem;
  /* 14px */
  --rta-space-8: 1rem;
  /* 16px */
  --rta-space-10: 1.25rem;
  /* 20px */
  --rta-space-12: 1.5rem;
  /* 24px */
  /* Cadres (fieldset, sections repliables, constructeurs) : un seul retrait
     horizontal, pour que tous les contrôles d'une fenêtre restent alignés. */
  --rta-frame-pad: .75rem;
  --rta-frame-border: 1px;
  --rta-frame-step: calc(var(--rta-frame-pad) + var(--rta-frame-border));
  /* Rythme : trois espacements seulement, horizontaux comme verticaux. */
  --rta-gap-tight: var(--rta-space-2);  /* 4px : listes compactes, icône + texte */
  --rta-gap-row: var(--rta-space-4);    /* 8px : entre lignes et contrôles d'un même cadre */
  --rta-gap-block: var(--rta-space-6);  /* 12px : entre cadres et sections */
  --rta-radius-rail: 2px;
  --rta-radius-compact: 4px;
  --rta-radius-control: 5px;
  --rta-radius-panel: 7px;

  --rta-type-micro: .5625rem;
  /* 9px, compact markers and SVG */
  --rta-type-xs: .625rem;
  /* 10px, badges and icons */
  --rta-type-sm: .75rem;
  /* 12px, small labels */
  --rta-type-base: .8125rem;
  /* 13px, secondary UI */
  --rta-type-control: .875rem;
  /* 14px, list rows */
  --rta-type-medium: 1rem;
  /* 16px, card titles */
  --rta-type-heading: 1.125rem;
  /* 18px, section titles */
  --rta-type-display: 1.625rem;
  /* 26px, page titles */
}

/* Couleurs. Les composants n'utilisent que ces jetons. Chaque jeton suit la
   variable du thème Foundry quand elle existe, avec UNE seule valeur de repli.
   Ils sont redéclarés sur les racines RTA car Foundry définit son thème sur un
   ancêtre (.theme-dark…), pas sur :root. */
:root, :is(.rta-configurator, .rta-config-entry, .rta-select__panel, .rta-sheet, .rta-chat-card, .rta-creation) {
  --rta-color-neutral: #666666; /* = DEFAULT_RULESET_COLOR / RTA_NEUTRAL_COLOR */
  --rta-color-border: var(--color-border-light-primary, #777);
  --rta-color-border-secondary: var(--color-border-light-secondary, #777);
  --rta-color-border-tertiary: var(--color-border-light-tertiary, #666);
  --rta-color-border-subtle: var(--color-border-light-2);
  --rta-color-border-highlight: var(--color-border-highlight, #947f9c);
  --rta-color-surface: var(--color-cool-5, #17141e);
  --rta-color-surface-raised: var(--color-cool-4, rgba(0, 0, 0, 0.12));
  --rta-color-surface-option-light: var(--color-bg-option, rgba(255, 255, 255, .35));
  --rta-color-surface-option: var(--color-bg-option, #2b2530);
  --rta-color-text: var(--color-text-primary);
  --rta-color-accent-warm: var(--color-warm-2);
  --rta-color-text-highlight: var(--color-text-light-highlight, #eee);
  --rta-color-text-secondary: var(--color-text-light-6, #bcb8bf);
  --rta-color-inverse-fill: #fff;
  --rta-color-inverse-text: #000;

  --rta-color-success-fill: #28570d;
  --rta-color-success-text: #e1f4d3;
  --rta-color-badge-fill: #34303d;
  --rta-color-badge-text: #ddd;
  --rta-color-success: var(--color-level-success, #6fa84b);
  --rta-color-danger: var(--color-level-error, #d0574b);
  --rta-color-warning: #dfad64;
  --rta-color-warning-muted: #d2c39d;

  --rta-shadow-color: #0007;
  --rta-shadow-color-strong: #000a;

  --rta-graph-edge: #b8a06d;
  --rta-graph-edge-active: #e0a05e;
  --rta-graph-node-fill: #29252e;
  --rta-graph-node-fill-hover: #4a4154;
  --rta-graph-node-fill-selected: #6b5639;
  --rta-graph-node-stroke: #827a88;
  --rta-graph-node-stroke-selected: #d6b76e;
  --rta-graph-node-stroke-unresolved: #d99255;
  --rta-graph-label: #f1e9df;
  --rta-graph-label-strong: #fff;
}

/* Rule Them'All — layout.css : Coquille du configurateur et éléments transverses.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

/* Les règles responsives suivent la fenêtre Foundry, pas le navigateur.
   Seuil @container = largeur de fenêtre visée − 34 px (bordure 2 px +
   marge intérieure 32 px de .window-content). */
.rta-configurator, .rta-config-entry {
  container: rta-window / inline-size;
  /* La containment inline-size annule la largeur intrinsèque : on force la
     largeur pleine pour ne pas dépendre du display du parent. */
  inline-size: 100%;
}


.rta-configurator__selector {
  flex-shrink: 0;
  margin-block: var(--rta-space-4);
}

.rta-configurator__toolbar {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  margin-block: var(--rta-space-3) var(--rta-space-5);
  flex-wrap: wrap;
}

.rta-config-table {
  min-width: 720px;
  width: 100%;
  table-layout: auto;
  overflow-wrap: anywhere;
}

.rta-config-table th,
.rta-config-table td {
  vertical-align: middle;
}

.rta-config-table th:last-child,
.rta-config-table td:last-child {
  white-space: nowrap;
}

.rta-config-actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--rta-gap-tight);
  flex-wrap: nowrap;
  white-space: nowrap;
}

.rta-config-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 30px;
  width: 30px;
  min-width: 30px;
  height: 30px;
  padding: 0;
  line-height: 1;
}

.rta-config-action > i {
  margin: 0;
  pointer-events: none;
}

.rta-config-action--danger {
  margin-inline-start: var(--rta-space-1);
}

/* root Rulesets + Ruleset workspace shell. */
.rta-configurator__error {
  flex-shrink: 0;
  white-space: pre-wrap;
  max-height: 6em;
  overflow: auto;
}

.rta-configurator__workspace-header > div {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.rta-configurator__workspace-header > div > span {
  opacity: 0.75;
}

.rta-configurator__workspace {
  display: grid;
  grid-template-columns: minmax(150px, 190px) minmax(0, 1fr);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.rta-configurator__sidebar {
  min-height: 0;
  overflow-y: auto;
  padding: var(--rta-space-5) var(--rta-space-4) var(--rta-space-5) var(--rta-space-3);
  border-right: 1px solid var(--rta-color-border);
}

.rta-configurator__sidebar button {
  display: block;
  width: 100%;
  text-align: left;
  margin: 0;
  border: 0;
  background: transparent;
}

.rta-configurator__sidebar button.active {
  font-weight: 700;
  background: var(--rta-color-surface-raised);
}

.rta-configurator__workspace-content {
  padding: var(--rta-space-6);
}

.rta-configurator__storage {
  margin-block-start: var(--rta-space-8);
}

@container rta-window (max-width: 666px) {
  .rta-configurator__workspace {
    grid-template-columns: minmax(125px, 150px) minmax(0, 1fr);
  }
}

.rta-config-table--compact {
  min-width: 0;
  font-size: 0.9em;
}

/* ergonomic field cards + single-line Ruleset header. */
.rta-configurator__workspace-header {
  border-bottom: 1px solid var(--rta-color-border);
  flex-wrap: nowrap;
  min-height: 3rem;
}

.rta-configurator__workspace-header > div:first-of-type {
  flex: 1;
  flex-direction: row;
  align-items: baseline;
  justify-content: center;
  gap: var(--rta-gap-row);
}

.rta-configurator__workspace-header > .rta-config-actions {
  flex: 0 0 auto;
  flex-direction: row;
  align-items: center;
  justify-content: flex-end;
}

.rta-configurator__section-actions {
  display: flex;
  gap: var(--rta-gap-row);
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* fixed three-row tiles at every supported window width. */
.rta-configurator__root-footer {
  flex: 0 0 auto;
  display: flex;
  justify-content: flex-end;
  margin-top: auto;
  padding: var(--rta-space-3) 0 var(--rta-space-5);
}

.rta-configurator .rta-configurator__workspace-header {
  position: relative;
  z-index: 1;
}

/* shared canonical border between General panels and collection tiles. */
.rta-configurator {
  --rta-card-width: 282px;
  --rta-card-height: 94px;
  --rta-card-gap: var(--rta-gap-block);
  --rta-card-action-size: 23px;
  --rta-card-padding-top: .65rem;
  --rta-card-padding-bottom: .5rem;
  --rta-panel-border: var(--rta-color-border);
  --rta-panel-radius: 4px;
  --rta-rail-width: 4px;
}

/* VERTICAL RHYTHM — same contract as the entry editors (editor.css):
   --rta-gap-block between the main blocks of a view, --rta-gap-row inside a
   card, panel or Runtime Lab step. */
.rta-configurator :is(.rta-configurator__scroll, .rta-runtime-lab, .rta-lab-step, nav.rta-explorer, .rta-dependencies__list, .rta-dependencies__detail, .rta-general__card, .rta-configurator__storage) {
  row-gap: 0;
}
.rta-configurator :is(.rta-configurator__scroll, .rta-runtime-lab, .rta-lab-step, nav.rta-explorer, .rta-dependencies__list, .rta-dependencies__detail, .rta-general__card, .rta-configurator__storage) > * {
  margin-block: 0;
}
.rta-configurator :is(.rta-lab-step, .rta-dependencies__list, .rta-dependencies__detail, .rta-general__card, .rta-configurator__storage) > :not([hidden], div:empty) ~ :not([hidden], div:empty) {
  margin-block-start: var(--rta-gap-row);
}
.rta-configurator :is(.rta-configurator__scroll, .rta-runtime-lab, nav.rta-explorer) > :not([hidden], div:empty) ~ :not([hidden], div:empty) {
  margin-block-start: var(--rta-gap-block);
}

/* Rule Them'All — explorer.css : Navigation à deux niveaux et panneau flottant.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

.rta-configurator__nav {
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: var(--rta-gap-tight);
}

.rta-configurator__nav-group {
  margin-block-start: var(--rta-space-6);
}

.rta-configurator__nav-group > span {
  display: block;
  padding: var(--rta-space-2) var(--rta-space-4);
  font-size: var(--rta-type-sm);
  font-weight: 700;
  text-align: center;
  opacity: 0.7;
}

/* Two-level Ruleset explorer, scoped to workspace */
.rta-explorer__heading>i {
  font-size: var(--rta-type-heading);
  color: var(--rta-card-accent, var(--rta-color-neutral));
}

.rta-explorer__heading>div {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.rta-explorer__columns {
  display: grid;
  grid-template-columns: 136px minmax(0,1fr);
  gap: var(--rta-gap-row);
  min-height: 0;
  flex: 1;
  overflow: hidden;
}

.rta-explorer__groups,.rta-explorer__details,.rta-explorer__results {
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
}

.rta-explorer button {
  height: auto;
  min-height: 32px;
  width: 100%;
  margin: 0;
  border: 0;
  box-shadow: none;
  text-align: left;
  background: transparent;
  color: inherit;
  font-size: var(--rta-type-sm);
  line-height: 1.25;
}

.rta-explorer__group {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-3) var(--rta-space-3);
  border-radius: 5px;
}

.rta-explorer__group i {
  flex: 0 0 16px;
  text-align: center;
  opacity: .85;
}

.rta-explorer__group.is-active {
  background: color-mix(in srgb, var(--rta-nav-accent, var(--rta-color-neutral)) 17%, transparent);
  border: 1px solid var(--rta-panel-border);
  border-radius: var(--rta-radius-compact);
  font-weight: 700;
}

.rta-explorer__detail-title {
  font-size: var(--rta-type-sm);
  font-weight: 700;
  padding: var(--rta-space-4) var(--rta-space-2) var(--rta-space-5);
  border-bottom: 1px solid var(--rta-color-border);
  margin-bottom: var(--rta-space-3);
}

.rta-explorer__item {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-3) var(--rta-space-2);
  border-radius: 4px;
  overflow-wrap: anywhere;
}

.rta-explorer__item:hover,.rta-explorer__group:hover {
  background: color-mix(in srgb, var(--rta-nav-accent, var(--rta-color-neutral)) 12%, transparent);
}

.rta-explorer__item.is-active {
  background: color-mix(in srgb, var(--rta-nav-accent, var(--rta-color-neutral)) 18%, transparent);
  font-weight: 700;
}

.rta-explorer__results {
  grid-column: 1/-1;
}

.rta-explorer__results[hidden],.rta-explorer__details[hidden],.rta-explorer button[hidden] {
  display: none;
}

@container rta-window (max-width: 726px) {
  .rta-explorer__columns {
    grid-template-columns: 116px minmax(0,1fr);
  }
}

/* compact overlay explorer; never changes editor width */
.rta-configurator__workspace:has(> .rta-explorer) {
  grid-template-columns: 180px minmax(0,1fr);
}

.rta-explorer {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  border-right: 1px solid var(--rta-color-border);
  position: relative;
  overflow: visible;
  z-index: 3;
  padding: var(--rta-space-6) var(--rta-space-4);
  gap: var(--rta-gap-block);
}

.rta-explorer__heading {
  display: flex;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-2) var(--rta-space-3);
  align-items: flex-start;
  min-height: 48px;
}

.rta-explorer__heading strong {
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: var(--rta-type-base);
  white-space: normal;
  line-height: 1.3;
}

.rta-explorer__heading small {
  opacity: .7;
  font-size: var(--rta-type-sm);
}

.rta-explorer__groups {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  overflow-y: auto;
  padding: var(--rta-space-2);
  background: rgba(125,125,125,.055);
  border-radius: var(--rta-radius-panel);
  flex: 1;
}

.rta-explorer .rta-explorer__group {
  width: 100%;
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-4) var(--rta-space-4);
  font-size: var(--rta-type-control);
  line-height: 1.3;
  text-align: left;
}

.rta-explorer__group span {
  flex: 1;
  text-align: left;
}

.rta-explorer__chevron {
  font-size: var(--rta-type-xs);
  opacity: .5;
}

.rta-explorer__group > i:first-child {
  color: var(--rta-nav-accent, var(--rta-color-neutral));
}

.rta-explorer__flyout[hidden],.rta-explorer__flyout-list section[hidden] {
  display: none;
}

.rta-explorer__flyout-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  font-size: var(--rta-type-control);
}

.rta-explorer .rta-explorer__flyout-heading button {
  width: 24px;
  min-height: 24px;
  flex: 0 0 24px;
  padding: var(--rta-space-1);
  text-align: center;
}

.rta-explorer .rta-explorer__item {
  min-height: 36px;
  font-size: var(--rta-type-base);
  line-height: 1.35;
  padding: var(--rta-space-3) var(--rta-space-2);
  overflow-wrap: normal;
  word-break: normal;
  text-align: left;
}

.rta-explorer__item span:last-child {
  text-align: left;
}

@container rta-window (max-width: 726px) {
  .rta-configurator__workspace:has(> .rta-explorer) {
    grid-template-columns: 165px minmax(0,1fr);
  }
}

/* readable overlay, special type configuration entries */
.rta-explorer__flyout {
  position: absolute;
  left: 100%;
  top: 60px;
  width: 180px;
  max-height: calc(100% - 65px);
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  z-index: 20;
  padding: var(--rta-space-5);
  background: var(--rta-color-surface);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-panel);
  box-shadow: 5px 5px 18px var(--rta-shadow-color-strong);
  box-sizing: border-box;
  overflow: hidden;
}

.rta-explorer__flyout-list {
  min-height: 0;
  scrollbar-width: thin;
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
}

.rta-explorer__flyout-list section {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  align-items: stretch;
  width: 100%;
}

.rta-explorer .rta-explorer__flyout-list .rta-explorer__item {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  min-height: 38px;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-4);
  text-align: left;
  font-size: var(--rta-type-control);
  line-height: 1.35;
  white-space: normal;
}

.rta-configurator .rta-explorer__flyout-list .rta-explorer__item > span:first-child {
  flex: 1 1 auto;
  min-width: 0;
