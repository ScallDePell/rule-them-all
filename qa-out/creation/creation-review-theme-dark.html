  --rta-choice-row-pad-block: .4rem;
  --rta-choice-row-pad-inline: .6rem;
  --rta-choice-row-fill: var(--rta-editor-fill);
}

/* Form and surface contracts shared across all editor kinds. */
.rta-config-entry :is(.rta-field-editor__grid, .rta-field-editor__numeric) > label:not(.rta-field-editor__check) {
  min-width: 0;
  line-height: 1.3;
}

.rta-config-entry :is(.rta-field-editor__grid, .rta-field-editor__numeric) > label > :is(input:not([type="checkbox"]),select,textarea) {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  margin: 0;
}

.rta-config-entry__fixed-capabilities {
  padding: var(--rta-space-4) var(--rta-space-5);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
}

.rta-config-entry__fixed-capabilities-list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rta-gap-row) var(--rta-gap-block);
  margin-top: var(--rta-space-3);
}

.rta-config-entry__fixed-capability {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-row);
}

.rta-config-entry__fixed-capability > small {
  opacity: .7;
}

/* CANONICAL FIELD ROW (all Rule Them'All entry editors).
   All normal controls — text, numeric, checkbox, textarea, RTA Select — share
   exactly this two-column geometry. There is no independent select layout.
   Sections, the Sheet Builder's toolbar, checkboxes in choice menus and the
   data-bearing acquisition cards remain specialized surface/interaction UI. */
:is(.rta-config-entry, .rta-configurator) {
  --rta-form-column-inset: 0px;
  --rta-form-label-column-min: 160px;
  --rta-form-label-column-max: 200px;
  --rta-form-control-gap: var(--rta-gap-block);
  --rta-form-row-gap: var(--rta-gap-row);
  --rta-form-control-height: 2.1rem;
}

:is(.rta-config-entry, .rta-configurator) .rta-form-row[hidden] { display: none; }

:is(.rta-config-entry, .rta-configurator) .rta-form-row {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(calc(var(--rta-form-label-column-min) - var(--rta-form-column-inset)), calc(var(--rta-form-label-column-max) - var(--rta-form-column-inset))) minmax(0, 1fr);
  gap: var(--rta-form-row-gap) var(--rta-form-control-gap);
  align-items: center;
  min-width: 0;
  width: 100%;
}

:is(.rta-config-entry, .rta-configurator) .rta-form-row > :is(label, .rta-form-row__label) {
  min-width: 0;
  margin: 0;
  align-self: center;
  line-height: 1.3;
  font-weight: 600;
}

:is(.rta-config-entry, .rta-configurator) .rta-form-row > :is(input[type="checkbox"], input[type="radio"], input[type="color"]) {
  justify-self: start;
  margin: 0;
}

/* Technical fields retain their own full-width/JSON layout, never an
   independent single-line control height. */
.rta-config-entry .rta-config-entry__technical input:not([type="checkbox"]):not([type="radio"]):not([type="color"]):not([type="hidden"]) {
  box-sizing: border-box;
  height: var(--rta-form-control-height);
  min-height: var(--rta-form-control-height);
}

/* The top-level Tags/Actions/etc. are not inside the framed fieldset's .8rem
   padding. Reserve the same right inset as their sibling controls, without
   adding a second/independent selection grid. */
.rta-config-entry__scroll > .rta-form-row--picker {
  padding-inline-end: var(--rta-space-6);
}

@container rta-window (max-width: 586px) {
  /* On narrow windows the form grid is a single column: align standalone
     pickers with the fields INSIDE the ordinary framed section. */
  .rta-config-entry__scroll > .rta-form-row--picker {
    padding-inline-start: var(--rta-space-6);
  }
}

/* Nested-label rows retain the implicit label association and avoid redundant
   reflow of the label's text node. Explicit body/grid label variants use the
   same two-column layout rather than their historical vertical stacking. */
:is(.rta-config-entry, .rta-configurator) label.rta-form-row--nested {
  font-weight: 600;
  display: grid;
  grid-template-columns: minmax(calc(var(--rta-form-label-column-min) - var(--rta-form-column-inset)), calc(var(--rta-form-label-column-max) - var(--rta-form-column-inset))) minmax(0, 1fr);
  gap: var(--rta-form-row-gap) var(--rta-form-control-gap);
  align-items: center;
}

:is(.rta-config-entry, .rta-configurator) .rta-field-editor label.rta-form-row--nested {
  display: grid;
  grid-template-columns: minmax(calc(var(--rta-form-label-column-min) - var(--rta-form-column-inset)), calc(var(--rta-form-label-column-max) - var(--rta-form-column-inset))) minmax(0, 1fr);
  gap: var(--rta-form-row-gap) var(--rta-form-control-gap);
  align-items: center;
}


@container rta-window (max-width: 586px) {
  :is(.rta-config-entry, .rta-configurator) .rta-form-row,
  :is(.rta-config-entry, .rta-configurator) label.rta-form-row--nested,
  :is(.rta-config-entry, .rta-configurator) .rta-field-editor label.rta-form-row--nested {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--rta-gap-tight);
  }
}

.rta-configurator .rta-collection-color-editor {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-row);
}

.rta-configurator .rta-collection-color-editor input[type="color"] {
  width: 3rem;
  min-height: var(--rta-form-control-height);
}

.rta-config-entry .rta-section-color-config {
  border-left: var(--rta-rail-width, 4px) solid var(--rta-section-color, var(--rta-color-neutral));
  padding-inline-start: calc(var(--rta-frame-step) - var(--rta-rail-width, 4px));
}

.rta-config-entry .rta-color-override-control {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--rta-gap-block);
}

.rta-config-entry .rta-color-override-check {
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-row);
}

/* Declarative controls use the canonical rta-form-row; no independent grid. */
.rta-config-entry .rta-declarative-constraint {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
  align-items: end;
  gap: var(--rta-form-control-gap);
}

.rta-config-entry .rta-declarative-constraint > label { min-width: 0; display: grid; gap: var(--rta-gap-tight); }

.rta-config-entry .rta-declarative-constraint > label > :is(input, select) { min-width: 0; width: 100%; height: var(--rta-form-control-height); min-height: var(--rta-form-control-height); }

.rta-config-entry .rta-declarative-presentation__controls { display: flex; align-items: center; gap: var(--rta-form-control-gap); min-width: 0; }

.rta-config-entry .rta-declarative-presentation__value { flex: 1; min-width: 0; }

.rta-config-entry .rta-declarative-presentation__value[hidden] { display: none; }

.rta-config-entry .rta-declarative-presentation__value > input:not([type="checkbox"]) { width: 100%; min-width: 0; }

.rta-config-entry .rta-declarative-toggle { display: inline-flex; gap: var(--rta-gap-row); align-items: center; margin: 0; white-space: nowrap; }

@container rta-window (max-width: 586px) { .rta-config-entry .rta-declarative-constraint { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rta-config-entry .rta-declarative-presentation__controls { flex-wrap: wrap; } }

.rta-config-entry .rta-config-table td:has(> input[type="checkbox"]) { text-align:center; vertical-align:middle; }

/* VERTICAL RHYTHM — one contract for every editor container.
   Children carry no vertical margin of their own; the container spaces them:
   --rta-gap-row between the rows/controls of a frame (header included),
   --rta-gap-block between the top-level frames of the window. */
.rta-config-entry :is(.rta-config-entry__scroll, fieldset, details[open], section.rta-config-entry__section, .rta-rule-builder, .rta-rule-operands, .rta-section-color-config, .rta-field-editor__body, .rta-config-entry__full-width, .rta-capability-contracts) {
  row-gap: 0;
}
.rta-config-entry :is(.rta-config-entry__scroll, fieldset, details[open], section.rta-config-entry__section, .rta-rule-builder, .rta-rule-operands, .rta-section-color-config, .rta-field-editor__body, .rta-config-entry__full-width, .rta-capability-contracts) > * {
  margin-block: 0;
}
.rta-config-entry :is(fieldset, details[open], section.rta-config-entry__section, .rta-rule-builder, .rta-rule-operands, .rta-section-color-config, .rta-field-editor__body, .rta-config-entry__full-width, .rta-capability-contracts) > :not([hidden], div:empty) ~ :not([hidden], div:empty) {
  margin-block-start: var(--rta-gap-row);
}
.rta-config-entry .rta-config-entry__scroll > :not([hidden], div:empty) ~ :not([hidden], div:empty) {
  margin-block-start: var(--rta-gap-block);
}

/* Paragraph margins never add to a frame's padding: the first and last text
   block of any container sit directly on the container's padding. */
.rta-config-entry :is(p, ul, ol):first-child { margin-block-start: 0; }
.rta-config-entry :is(p, ul, ol):last-child { margin-block-end: 0; }

/* Boolean options of a field card follow the same row contract as "Enabled":
   text in the label column, checkbox at the start of the control column. */
:is(.rta-config-entry, .rta-configurator) label.rta-field-editor__check {
  display: grid;
  grid-template-columns: minmax(calc(var(--rta-form-label-column-min) - var(--rta-form-column-inset)), calc(var(--rta-form-label-column-max) - var(--rta-form-column-inset))) minmax(0, 1fr);
  gap: var(--rta-form-row-gap) var(--rta-form-control-gap);
  align-items: center;
  font-weight: 600;
}
:is(.rta-config-entry, .rta-configurator) label.rta-field-editor__check > input[type="checkbox"] {
  grid-column: 2;
  grid-row: 1;
  justify-self: start;
}
@container rta-window (max-width: 586px) {
  :is(.rta-config-entry, .rta-configurator) label.rta-field-editor__check {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--rta-gap-tight);
  }
  :is(.rta-config-entry, .rta-configurator) label.rta-field-editor__check > input[type="checkbox"] {
    grid-column: 1;
    grid-row: 2;
  }
}

/* Pool bound (ValueSource): source kind, then the number or the Formula. */
.rta-config-entry .rta-value-source {
  display: flex;
  gap: var(--rta-gap-tight);
  min-width: 0;
}

.rta-config-entry .rta-value-source > * {
  flex: 1 1 0;
  min-width: 0;
}

.rta-config-entry .rta-value-source__input {
  display: flex;
}

.rta-config-entry .rta-value-source__input > * {
  flex: 1 1 auto;
  min-width: 0;
}

.rta-config-entry .rta-value-source > [hidden],
.rta-config-entry [data-slot-kinds][hidden] {
  display: none;
}

/* A field reached from "Ready to publish": highlighted for a few seconds. */
@keyframes rta-diagnostic-focus {
  0%, 70% { outline-color: var(--rta-color-warning); }
  100% { outline-color: transparent; }
}

.rta-config-entry .rta-diagnostic-focus {
  outline: 2px solid transparent;
  outline-offset: 2px;
  border-radius: var(--rta-radius-control);
  animation: rta-diagnostic-focus 4s ease-out;
}

/* Built-in help (§8): a folded section at the top of every editor. */
.rta-config-entry__help-body {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

.rta-config-entry__help-body p {
  margin: 0;
}

/* Ordered reference list (a Test's Outcomes): order comes from drag and drop. */
.rta-ordered-list__items {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  margin: 0;
  padding: 0;
  list-style: none;
}

.rta-ordered-list__item {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-2) var(--rta-space-3);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-compact);
  background: var(--rta-color-surface-raised);
}

.rta-ordered-list__item[hidden] {
  display: none;
}

.rta-ordered-list__item[draggable="true"] {
  cursor: grab;
}

.rta-ordered-list__item--dragging {
  opacity: 0.35;
}

.rta-ordered-list__handle {
  color: var(--rta-color-text-secondary);
}

.rta-ordered-list__label {
  flex: 1;
}


/* Trigger filter row: payload field, expected value, remove (same grid as constraint rows). */
.rta-config-entry .rta-trigger-filter {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
  align-items: end;
  gap: var(--rta-form-control-gap);
}

.rta-config-entry .rta-trigger-filter > label { min-width: 0; display: grid; gap: var(--rta-gap-tight); }

.rta-config-entry .rta-trigger-filter > label > :is(input, select) { min-width: 0; width: 100%; height: var(--rta-form-control-height); min-height: var(--rta-form-control-height); }

/* Rule Them'All — choices.css : Listes de choix, pickers, cartes de liaison.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

.rta-picker > strong {
  margin-bottom: var(--rta-space-1);
}

.rta-picker > label {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  margin: 0;
}

.rta-picker > p {
  margin: 0;
  opacity: .7;
  font-style: italic;
}

.rta-picker {
  flex-direction: column;
  gap: var(--rta-gap-row);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
  background: color-mix(in srgb, var(--rta-color-surface) 8%, transparent);
  display: block;
  max-height: none;
  overflow: visible;
  padding: 0;
}

.rta-picker > summary {
  position: relative;
  display: grid;
  grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr);
  gap: var(--rta-gap-block);
  align-items: center;
  padding: var(--rta-space-4) var(--rta-space-5);
  cursor: pointer;
  list-style: none;
}

.rta-picker > summary::-webkit-details-marker {
  display: none;
}

.rta-picker > summary::before {
  content: "▸";
  grid-column: 1;
  position: absolute;
}

.rta-picker[open] > summary::before {
  content: "▾";
}

.rta-picker > summary > strong {
  padding-inline-start: var(--rta-space-8);
}

.rta-picker > summary > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: .78;
}

.rta-picker__body {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  max-height: 14rem;
  overflow: auto;
  padding: var(--rta-space-4) var(--rta-space-5) var(--rta-space-6);
  border-top: 1px solid var(--rta-color-border);
}

.rta-picker__body > input[type="search"] {
  position: sticky;
  top: 0;
  z-index: 1;
  width: 100%;
}

.rta-picker__body > label {
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  margin: 0;
}

.rta-picker__body > p {
  margin: 0;
  opacity: .7;
  font-style: italic;
}

/* Bordered editor cards */
.rta-binding-card {
  border: 1px solid var(--rta-color-border-tertiary);
  border-radius: var(--rta-radius-panel);
  padding: var(--rta-space-4) var(--rta-space-5);
}

/* Shared editor window contract. Reuse the same section surface for
   collapsible pickers, technical blocks and field cards. No per-entry theme. */
.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical) {
  box-sizing: border-box;
  display: block;
  min-width: 0;
  margin: 0;
  border: 1px solid var(--rta-editor-border);
  border-radius: var(--rta-editor-radius);
  background: var(--rta-editor-fill);
  padding: 0 var(--rta-frame-pad);
  overflow: visible;
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical) > summary {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: var(--rta-gap-block);
  position: relative;
  min-height: 2.35rem;
  padding: var(--rta-space-4) 0;
  margin: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  list-style: none;
  font-weight: 700;
  line-height: 1.3;
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical) > summary::-webkit-details-marker {
  display: none;
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical) > summary::before {
  content: "▸";
  position: static;
  display: inline-block;
  flex: 0 0 .65rem;
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical)[open] > summary::before {
  content: "▾";
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical) > summary > strong {
  padding: 0;
  flex: 0 1 auto;
  min-width: 0;
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical) > summary > span {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0;
  margin: 0;
  opacity: .75;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 400;
}

.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical)[open] > summary {
  border-bottom: 1px solid var(--rta-editor-border);
}

/* An open frame keeps the same interior padding below its last row. */
.rta-config-entry :is(details.rta-config-entry__section, details.rta-picker, details.rta-config-entry__technical)[open] {
  padding-bottom: var(--rta-frame-pad);
}

.rta-config-entry .rta-picker__body {
  border: 0;
  padding: 0;
  margin: 0;
  max-height: 14rem;
  overflow-y: auto;
}

.rta-config-entry .rta-picker__body > label {
  min-height: 1.8rem;
}

/* A card holding form rows is a frame: border plus padding is one --rta-frame-step. */
.rta-config-entry .rta-binding-card {
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-editor-border);
  border-radius: var(--rta-editor-radius);
  background: var(--rta-editor-fill);
}

/* Script-built lists and cards (slots, choice groups, relations, constraints):
   one row gap between children, however many rows a script appends. */
.rta-config-entry :is([data-slot-list], [data-choice-group-list], [data-relation-list], [data-declarative-constraints], [data-test-input-list], [data-card-list-body], .rta-generic-relation, .rta-generic-relation__fields),
.rta-config-entry :is(.rta-binding-card, .rta-outcome-mapping, .rta-die-face-counts),
.rta-config-entry [data-mapping-actions]:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

/* An empty list takes no room: unlike a block, a flex box does not let the
   margins around it collapse. */
.rta-config-entry :is([data-slot-list], [data-choice-group-list], [data-relation-list], [data-declarative-constraints], [data-test-input-list], [data-card-list-body]):not(:has(> *)) {
  display: none;
}

/* An empty-state line sits in the list's rhythm and leaves once a script adds a row. */
.rta-config-entry :is(.rta-field-editor-list, [data-slot-list], [data-choice-group-list], [data-relation-list]) > p {
  margin: 0;
}

.rta-config-entry :is(.rta-field-editor-list, [data-slot-list], [data-choice-group-list], [data-relation-list]) > p:has(~ article) {
  display: none;
}

/* A relation is a frame of rows, like a slot card. */
.rta-config-entry .rta-generic-relation {
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-editor-border);
  border-radius: var(--rta-editor-radius);
  background: var(--rta-editor-fill);
}

.rta-config-entry .rta-generic-relation > [data-action="removeRelation"] {
  align-self: flex-end;
}

/* One scroll and spacing contract for open and collapsible checkbox collections.
   The explicit compact modifier is retained for genuinely space-constrained rows. */
.rta-config-entry .rta-choice-list {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-tight);
  min-width: 0;
  max-height: 14rem;
  overflow-y: auto;
}

.rta-config-entry .rta-choice-list.rta-config-entry__check-group--inline {
  max-height: 9rem;
}

.rta-config-entry .rta-choice-list > label {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: var(--rta-gap-row);
  flex: 0 0 auto;
  min-height: 2.35rem;
  margin: 0;
  padding: var(--rta-choice-row-pad-block) var(--rta-choice-row-pad-inline);
  border: 1px solid var(--rta-choice-row-border);
  border-radius: var(--rta-choice-row-radius);
  background: var(--rta-choice-row-fill);
  min-width: 0;
  cursor: pointer;
}

.rta-config-entry .rta-choice-list > label > input[type="checkbox"] {
  flex: 0 0 auto;
  margin: 0;
}

.rta-config-entry .rta-choice-list > label > :is(small, span) {
  min-width: 0;
}

/* Specific controls retain Foundry's native checked/disabled/focus appearance. */
.rta-config-entry .rta-choice-list > label:focus-within {
  outline: 1px solid var(--rta-color-border-highlight);
  outline-offset: 1px;
}

.rta-config-entry .rta-binding-card[hidden] {
  display: none;
}

/* A framed section/card already has horizontal interior padding. Instead of
   changing the shared column anchor, subtract that same padding from its label
   track. The select, input and textarea remain on a single visual vertical. */
/* The inset is inherited, so a row wrapped in an unframed <div> keeps its
   frame's compensation. Each nested frame adds exactly one --rta-frame-step. */
:is(.rta-config-entry, .rta-configurator) :is(fieldset, details.rta-config-entry__section, details.rta-config-entry__technical, .rta-rule-builder, .rta-section-color-config, .rta-field-editor, .rta-binding-card, .rta-generic-relation) {
  --rta-form-column-inset: var(--rta-frame-step);
}
:is(.rta-config-entry, .rta-configurator) :is(fieldset, details.rta-config-entry__section, details.rta-config-entry__technical, .rta-rule-builder, .rta-section-color-config, .rta-field-editor, .rta-binding-card, .rta-generic-relation) :is(fieldset, details.rta-config-entry__section, details.rta-config-entry__technical, .rta-rule-builder, .rta-section-color-config, .rta-field-editor, .rta-binding-card, .rta-generic-relation) {
  --rta-form-column-inset: calc(2 * var(--rta-frame-step));
}
:is(.rta-config-entry, .rta-configurator) :is(fieldset, details.rta-config-entry__section, details.rta-config-entry__technical, .rta-rule-builder, .rta-section-color-config, .rta-field-editor, .rta-binding-card, .rta-generic-relation) :is(fieldset, details.rta-config-entry__section, details.rta-config-entry__technical, .rta-rule-builder, .rta-section-color-config, .rta-field-editor, .rta-binding-card, .rta-generic-relation) :is(fieldset, details.rta-config-entry__section, details.rta-config-entry__technical, .rta-rule-builder, .rta-section-color-config, .rta-field-editor, .rta-binding-card, .rta-generic-relation) {
  --rta-form-column-inset: calc(3 * var(--rta-frame-step));
}

/* Only standalone selector rows own a flow margin. Form stacks/fieldsets own
   their own spacing, so applying two independent margins would cause gaps. */

/* Rule Them'All — rule-builder.css : Éditeurs de Formule et de Condition.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

.rta-rule-builder {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  padding: var(--rta-frame-pad);
  border: var(--rta-frame-border) solid var(--rta-color-border);
  border-radius: var(--rta-radius-panel);
  background: rgba(255,255,255,.018);
}

.rta-rule-builder__heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--rta-gap-row);
}

.rta-rule-builder__heading > span {
  opacity: .7;
  font-size: .9em;
}

/* Formula and Condition use the SAME canonical form-row as the rest of the
   entry editor. Only their right-hand control area is specialized (kind | value
   | optional removal). The rule builder's own border/padding is compensated
   so its fields start on the same vertical as Name, Description and Tags. */
.rta-rule-operands {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
  min-width: 0;
}

.rta-rule-operand__controls {
  display: grid;
  grid-template-columns: minmax(8rem, 10rem) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--rta-gap-row);
  min-width: 0;
  width: 100%;
}

/* Formula/Condition right-hand controls must reach the same right edge
   as the ordinary Name, Description and Tags controls outside Rule. The
   builder has .7rem padding and a 1px border of its own. */
:is(.rta-config-entry, .rta-configurator) .rta-rule-builder > .rta-form-row,
:is(.rta-config-entry, .rta-configurator) .rta-rule-builder .rta-rule-operand.rta-form-row {
  width: calc(100% + .7rem + 1px);
}

/* A Condition operand has no remove button. Do not leave an empty third
   grid track plus its gap: the value is then the natural end of the row. */
.rta-rule-operand__controls:not(:has(> [data-action="removeRuleOperand"])) {
  grid-template-columns: minmax(8rem,10rem) minmax(0,1fr);
}

.rta-rule-operand__controls > [data-rule-operand-editor] {
  grid-column: 2;
  min-width: 0;
  width: 100%;
}

.rta-rule-operand__controls > [data-action="removeRuleOperand"] {
  grid-column: 3;
}

/* An operand made of several parts (the dice of a roll, a distance, Actors nearby):
   its controls stack in the value column, each as wide as an ordinary value. */
.rta-rule-operand__controls > .rta-rule-operand__parts:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: var(--rta-gap-row);
}

.rta-rule-operand__parts > span > :is(input, select, .rta-select) {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

/* Rule Them'All — select.css : Composant RTA Select.
   L'ordre de chargement (module.json "styles") fait partie de la cascade. */

.rta-rule-operand__controls > [data-rule-operand-editor] > :is(input,select,.rta-select),
.rta-rule-operand__controls > .rta-select {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

/* Operand controls use the SAME editor field-height token as all other
   normal controls; never a private 32px height. */
.rta-rule-builder .rta-select__trigger,
.rta-rule-builder .rta-rule-operand__controls > [data-rule-operand-editor] > input {
  height: var(--rta-form-control-height);
  min-height: var(--rta-form-control-height);
}

@container rta-window (max-width: 586px) {
  .rta-picker > summary {
    grid-template-columns: 1fr;
    gap: var(--rta-gap-tight);
  }
  .rta-picker > summary > span {
    padding-inline-start: var(--rta-space-8);
  }
  .rta-rule-operand__controls {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .rta-rule-operand__controls > .rta-select {
    grid-column: 1;
    grid-row: 1;
  }
  .rta-rule-operand__controls > [data-rule-operand-editor] {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .rta-rule-operand__controls > [data-action="removeRuleOperand"] {
    grid-column: 2;
    grid-row: 1;
  }
}

/* RTA Select — ONE visual contract for every single/multi selector.
   No item frames: only a classic collapsed field and plain checkbox rows.
   Popover top layer avoids clipping by Foundry ApplicationV2 scroll areas.
   Native selects/checkboxes retain form semantics and event contracts. */
.rta-config-entry .rta-select,
.rta-configurator .rta-select {
  display: block;
  position: relative;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  margin: 0;
  border: 0;
  background: transparent;
}

.rta-select > .rta-select__trigger {
  box-sizing: border-box;
  width: 100%;
  min-height: 2.1rem;
  height: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--rta-gap-row);
  padding: var(--rta-space-3) var(--rta-space-5);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
  background: var(--rta-color-surface-option);
  color: var(--rta-color-text, inherit);
  font: inherit;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
}

.rta-select > .rta-select__trigger:hover:not(:disabled),
.rta-select > .rta-select__trigger:focus-visible {
  border-color: var(--rta-color-border-highlight);
  outline: 1px solid var(--rta-color-border-highlight);
  outline-offset: 0;
}

.rta-select__trigger:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.rta-select__value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.rta-select__placeholder {
  opacity: .68;
}

.rta-select__chevron {
  flex: 0 0 auto;
  opacity: .8;
}

/* Explicit cardinality (1, 0..1, 1..n, 0..n): small, never the only state signal. */
.rta-select__cardinality {
  flex: 0 0 auto;
  padding: 0 var(--rta-space-2);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
  font-size: .75em;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  opacity: .75;
}

.rta-select__panel,
.rta-select__panel:popover-open {
  box-sizing: border-box;
  position: fixed;
  z-index: 10000;
  min-width: 190px;
  max-width: min(680px, 98vw);
  max-height: min(330px, 72vh);
  margin: 0;
  padding: var(--rta-space-3);
  border: 1px solid var(--rta-color-border);
  border-radius: var(--rta-radius-control);
  background: var(--rta-color-surface-option);
  color: var(--rta-color-text, inherit);
  box-shadow: 0 8px 24px var(--rta-shadow-color);
  overflow: hidden;
}

.rta-select__panel[hidden] {
  display: none;
}

.rta-select__search {
  width: 100%;
  display: block;
  box-sizing: border-box;
  min-height: 2rem;
  margin: 0 0 var(--rta-space-2);
  padding: var(--rta-space-3) var(--rta-space-5);
  border-radius: var(--rta-radius-compact);
}

.rta-select .rta-select__options,
.rta-select__panel .rta-select__options {
  display: flex;
  flex-direction: column;
  gap: 0;
  max-height: min(240px, 54vh);
  overflow-y: auto;
  overscroll-behavior: contain;
  min-width: 0;
  padding: 0;
  margin: 0;
  border: 0;
}

/* Override the old .rta-choice-list border cards only inside the new selector. */
.rta-config-entry .rta-select__options > label.rta-select__option,
.rta-configurator .rta-select__options > label.rta-select__option,
.rta-select__panel .rta-select__options > label.rta-select__option {
  box-sizing: border-box;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--rta-gap-row);
  flex: 0 0 auto;
  width: 100%;
  min-height: 1.9rem;
  padding: var(--rta-space-2) var(--rta-space-3);
  margin: 0;
  border: none;
  border-radius: var(--rta-radius-compact);
  background: transparent;
  font: inherit;
  font-weight: 400;
  cursor: pointer;
}

.rta-select__panel .rta-select__option:hover:not(.is-disabled) {
  background: var(--rta-color-surface);
}

.rta-select__panel label.rta-select__option[hidden] {
  display: none;
}

.rta-select__panel .rta-select__option.is-disabled {
  opacity: .46;
  cursor: not-allowed;
}

/* Seule exception aux !important : le <select> natif reste dans le DOM pour le
   formulaire mais doit être masqué quelles que soient les règles de largeur. */
.rta-select__native {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  opacity: 0 !important;
  pointer-events: none !important;
  overflow: hidden !important;
}

.rta-select__radio-sources {
  display: none;
}

.rta-select__panel .rta-select__options > p {
  margin: var(--rta-space-3);
  opacity: .7;
}

/* permanent context labels and clearly non-editable required capabilities. */
.rta-select > .rta-select__label {
  display: block;
  font: inherit;
  font-weight: 600;
  margin: 0 0 var(--rta-space-2);
  color: var(--rta-color-text, inherit);
}

:is(.rta-config-entry, .rta-configurator) .rta-form-row > :is(.rta-form-row__control, .rta-select, select, textarea, input:not([type="checkbox"]):not([type="radio"]):not([type="color"])) {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  margin: 0;
}

:is(.rta-config-entry, .rta-configurator) .rta-form-row__control > .rta-select {
  width: 100%;
  min-width: 0;
  margin: 0;
}

/* The canonical height is shared by the text/number/date input AND RTA Select.
   Textareas, color pickers, checkboxes, toolbar buttons and multi-control cards
   remain inherently different controls; they are not given an arbitrary height. */
:is(.rta-config-entry, .rta-configurator) .rta-form-row :is(input:not([type="checkbox"]):not([type="radio"]):not([type="color"]):not([type="hidden"]), .rta-select__trigger) {
  box-sizing: border-box;
  height: var(--rta-form-control-height);
  min-height: var(--rta-form-control-height);
  max-height: var(--rta-form-control-height);
}

/* Real selector labels sit in the left column. Only toolbar selectors with no
   external title are allowed the fallback internal (vertical) title. */
:is(.rta-config-entry, .rta-configurator) .rta-form-row .rta-select > .rta-select__label {
  display: none;
}

/* uniform color rails for ALL RTA Select adapters.
   Use persisted colors when available, canonical #666666 otherwise.
   Checkbox geometry and original values are unchanged. */
.rta-select__panel .rta-select__accents {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: var(--rta-gap-tight);
  align-self: center;
  margin: 0;
  height: 1.18rem;
}

.rta-select__panel .rta-select__accent {
  display: block;
  width: 3px;
  min-width: 3px;
  height: 100%;
  border-radius: var(--rta-radius-rail);
}

/* ONE checkbox geometry for the whole module. Foundry draws the box and the
   check mark as ::before/::after icons of --checkbox-size: the input must be
   exactly that size, otherwise the two icon layers drift apart. */
:is(.rta-config-entry, .rta-configurator, .rta-select__panel, .rta-sheet, .rta-creation) input[type="checkbox"] {
  inline-size: var(--checkbox-size, 1.25rem);
  block-size: var(--checkbox-size, 1.25rem);
  flex: 0 0 auto;
  vertical-align: middle;
  margin: 0;
}
