name: Checks

# Every push to main and every pull request: the same gate as a release, without building anything.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Architecture audit
        run: node qa/architecture-audit.mjs --strict
      - name: Release readiness
        run: node qa/release-readiness.mjs --strict
